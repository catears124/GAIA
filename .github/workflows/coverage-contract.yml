name: Employer coverage contract

on:
  pull_request:
    paths:
      - ".github/workflows/coverage-contract.yml"
      - ".github/workflows/reconcile.yml"
      - ".github/workflows/production-coverage-diagnostics.yml"
      - ".github/workflows/runtime-coverage.yml"
      - "src/gaia/career_surface_collector.py"
      - "src/gaia/cli.py"
      - "src/gaia/employer_census.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/maintenance_api.py"
      - "src/gaia/production_coverage.py"
      - "src/gaia/provider_discovery.py"
      - "src/gaia/source_catalog.py"
      - "src/gaia/universe.py"
      - "src/gaia/default_sources.yaml"
      - "tests/test_bulk_employer_reconcile.py"
      - "tests/test_career_surface_discovery.py"
      - "tests/test_continuous_inventory.py"
      - "tests/test_critical_reconcile.py"
      - "tests/test_employer_universe.py"
      - "tests/test_maintenance_api.py"
      - "tests/test_prior_year_intelligence.py"
      - "tests/test_production_coverage.py"
      - "tests/test_recursive_source_candidates.py"
  push:
    branches: [main, coverage-repair-20260731]
    paths:
      - ".github/workflows/coverage-contract.yml"
      - ".github/workflows/reconcile.yml"
      - ".github/workflows/production-coverage-diagnostics.yml"
      - ".github/workflows/runtime-coverage.yml"
      - "src/gaia/career_surface_collector.py"
      - "src/gaia/cli.py"
      - "src/gaia/employer_census.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/maintenance_api.py"
      - "src/gaia/production_coverage.py"
      - "src/gaia/provider_discovery.py"
      - "src/gaia/source_catalog.py"
      - "src/gaia/universe.py"
      - "src/gaia/default_sources.yaml"
      - "tests/test_bulk_employer_reconcile.py"
      - "tests/test_career_surface_discovery.py"
      - "tests/test_continuous_inventory.py"
      - "tests/test_critical_reconcile.py"
      - "tests/test_employer_universe.py"
      - "tests/test_maintenance_api.py"
      - "tests/test_prior_year_intelligence.py"
      - "tests/test_production_coverage.py"
      - "tests/test_recursive_source_candidates.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employer-coverage-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Verify employer census and production coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaia_coverage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaia_coverage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GAIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_coverage
      GAIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_coverage
      GAIA_INITIAL_SYNC: "0"
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Migrate isolated PostgreSQL
        run: gaia migrate
      - name: Lint coverage implementation
        run: >-
          ruff check
          src/gaia/career_surface_collector.py
          src/gaia/inventory_runtime.py
          src/gaia/maintenance_api.py
          src/gaia/production_coverage.py
          src/gaia/provider_discovery.py
          src/gaia/source_catalog.py
          tests/test_career_surface_discovery.py
          tests/test_continuous_inventory.py
          tests/test_maintenance_api.py
          tests/test_prior_year_intelligence.py
          tests/test_production_coverage.py
          tests/test_recursive_source_candidates.py
      - name: Verify employer coverage contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_career_surface_discovery.py \
            tests/test_continuous_inventory.py \
            tests/test_prior_year_intelligence.py \
            tests/test_recursive_source_candidates.py \
            tests/test_maintenance_api.py \
            tests/test_production_coverage.py \
            tests/test_critical_reconcile.py \
            tests/test_bulk_employer_reconcile.py \
            tests/test_employer_universe.py::test_yc_directory_creates_employer_observations_not_jobs \
            tests/test_employer_universe.py::test_historical_technical_employer_is_a_blind_spot_until_enumerated \
            tests/test_employer_universe.py::test_validated_direct_source_enumerates_employer \
            tests/test_employer_universe.py::test_ecosystem_only_employer_enters_unresolved_frontier \
            tests/test_employer_universe.py::test_universe_timestamps_are_timezone_aware \
            tests/test_employer_universe.py::test_production_checker_can_require_employer_universe
