name: Runtime inventory diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-inventory-diagnostic
  cancel-in-progress: true

jobs:
  tick:
    name: Run one manual Vercel inventory pulse
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger one bounded runtime pulse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          status=$(curl --silent --show-error --location \
            --request POST \
            --user-agent "GAIA-production-maintenance/${GITHUB_RUN_ID}" \
            --connect-timeout 10 --max-time 20 \
            --dump-header evidence/tick.headers \
            --output evidence/tick.json \
            --write-out '%{http_code}' \
            https://gaiajob.vercel.app/api/maintenance/tick || printf '000')
          cat evidence/tick.json || true
          test "$status" = 200
          jq -e 'type == "object" and (.status | IN("ok", "partial", "not_due"))' evidence/tick.json >/dev/null

      - name: Verify public read endpoints
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in health stats; do
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --output "evidence/${endpoint}.json" \
              --write-out '%{http_code}' \
              "https://gaiajob.vercel.app/api/${endpoint}" || printf '000')
            test "$status" = 200
            jq -e 'type == "object"' "evidence/${endpoint}.json" >/dev/null
          done

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-inventory-diagnostic-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
