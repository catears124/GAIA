name: One-shot universe correction

on:
  push:
    branches: [agent/trust-ui-reconcile]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trust-ui-reconcile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Apply reviewed corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          universe = Path("src/gaia/universe.py")
          text = universe.read_text(encoding="utf-8")
          text = text.replace("and technical >= 0.55", "and technical >= 0.5")
          universe.write_text(text, encoding="utf-8")

          census = Path("src/gaia/employer_census.py")
          text = census.read_text(encoding="utf-8")
          old = '''                candidate_urls.extend(
                    url
                    for _, url in _external_links(jobs_body, final_url)
                    if urlsplit(url).netloc.casefold()
                    not in {"ycombinator.com", "www.ycombinator.com"}
                )'''
          new = '''                candidate_urls.extend(
                    url
                    for _, url in _external_links(jobs_body, final_url)
                    if urlsplit(url).netloc.casefold()
                    not in EXCLUDED_PROFILE_HOSTS
                )'''
          if old not in text:
              raise SystemExit("expected YC jobs link block not found")
          census.write_text(text.replace(old, new), encoding="utf-8")
          PY
          ruff check . --fix
          rm .github/workflows/branch-autofix.yml
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct employer frontier thresholds and lint"
          git push origin HEAD:agent/trust-ui-reconcile
