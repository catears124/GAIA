name: Verified job production sprint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verified-job-sprint.yml"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of five-minute production advancement cycles"
        required: false
        default: "6"
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-production-sprint
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: https://gaiajob.vercel.app
      CYCLES: ${{ inputs.cycles || '6' }}
    steps:
      - name: Repeatedly advance production inventory
        id: sprint
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"

          fetch_stats() {
            local name="$1"
            curl --silent --show-error --location \
              --user-agent "$ua" \
              --connect-timeout 10 --max-time 45 \
              --retry 2 --retry-all-errors --retry-delay 2 \
              --output "evidence/${name}.json" \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/stats" > "evidence/${name}.status" || {
                printf '000\n' > "evidence/${name}.status"
                printf '{}\n' > "evidence/${name}.json"
              }
          }

          fetch_health() {
            local name="$1"
            curl --silent --show-error --location \
              --user-agent "$ua" \
              --connect-timeout 10 --max-time 45 \
              --retry 2 --retry-all-errors --retry-delay 2 \
              --output "evidence/${name}.json" \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/health" > "evidence/${name}.status" || {
                printf '000\n' > "evidence/${name}.status"
                printf '{}\n' > "evidence/${name}.json"
              }
          }

          post_endpoint() {
            local name="$1" path="$2" max_time="$3"
            curl --silent --show-error --location \
              --request POST \
              --user-agent "$ua" \
              --connect-timeout 15 --max-time "$max_time" \
              --output "evidence/${name}.json" \
              --write-out '%{http_code}' \
              "${BASE_URL}${path}" > "evidence/${name}.status" || {
                printf '000\n' > "evidence/${name}.status"
                printf '{}\n' > "evidence/${name}.json"
              }
          }

          fetch_stats baseline-stats
          fetch_health baseline-health
          baseline_verified=$(jq -r '.new_today // 0' evidence/baseline-stats.json)
          baseline_families=$(jq -r '.role_families // 0' evidence/baseline-stats.json)
          baseline_open=$(jq -r '.active_listings // 0' evidence/baseline-stats.json)
          baseline_fresh=$(jq -r '.inventory.fresh // 0' evidence/baseline-health.json)

          cycles="$CYCLES"
          if ! [[ "$cycles" =~ ^[0-9]+$ ]]; then cycles=6; fi
          if [ "$cycles" -lt 1 ]; then cycles=1; fi
          if [ "$cycles" -gt 7 ]; then cycles=7; fi

          for cycle in $(seq 1 "$cycles"); do
            post_endpoint "cycle-${cycle}-tick" /api/maintenance/tick 180
            post_endpoint "cycle-${cycle}-discover" /api/maintenance/discover 240
            fetch_stats "cycle-${cycle}-stats"
            fetch_health "cycle-${cycle}-health"
            {
              echo "cycle=${cycle}"
              echo "tick_http=$(tr -d '\r\n' < "evidence/cycle-${cycle}-tick.status")"
              echo "tick_operation=$(jq -r '.status // "transport_error"' "evidence/cycle-${cycle}-tick.json")"
              echo "discover_http=$(tr -d '\r\n' < "evidence/cycle-${cycle}-discover.status")"
              echo "discover_operation=$(jq -r '.status // "transport_error"' "evidence/cycle-${cycle}-discover.json")"
              echo "new_verified=$(jq -r '.new_today // 0' "evidence/cycle-${cycle}-stats.json")"
              echo "active_families=$(jq -r '.role_families // 0' "evidence/cycle-${cycle}-stats.json")"
              echo "active_openings=$(jq -r '.active_listings // 0' "evidence/cycle-${cycle}-stats.json")"
              echo "fresh_sources=$(jq -r '.inventory.fresh // 0' "evidence/cycle-${cycle}-health.json")"
            } > "evidence/cycle-${cycle}.txt"
            cat "evidence/cycle-${cycle}.txt"
            if [ "$cycle" -lt "$cycles" ]; then sleep 310; fi
          done

          fetch_stats final-stats
          fetch_health final-health
          final_verified=$(jq -r '.new_today // 0' evidence/final-stats.json)
          final_families=$(jq -r '.role_families // 0' evidence/final-stats.json)
          final_open=$(jq -r '.active_listings // 0' evidence/final-stats.json)
          final_fresh=$(jq -r '.inventory.fresh // 0' evidence/final-health.json)
          verified_delta=$((final_verified - baseline_verified))
          family_delta=$((final_families - baseline_families))
          opening_delta=$((final_open - baseline_open))
          fresh_delta=$((final_fresh - baseline_fresh))

          jq -n \
            --argjson baseline_verified "$baseline_verified" \
            --argjson final_verified "$final_verified" \
            --argjson verified_delta "$verified_delta" \
            --argjson baseline_families "$baseline_families" \
            --argjson final_families "$final_families" \
            --argjson family_delta "$family_delta" \
            --argjson baseline_open "$baseline_open" \
            --argjson final_open "$final_open" \
            --argjson opening_delta "$opening_delta" \
            --argjson baseline_fresh "$baseline_fresh" \
            --argjson final_fresh "$final_fresh" \
            --argjson fresh_delta "$fresh_delta" \
            '{baseline_verified:$baseline_verified,final_verified:$final_verified,verified_delta:$verified_delta,baseline_families:$baseline_families,final_families:$final_families,family_delta:$family_delta,baseline_openings:$baseline_open,final_openings:$final_open,opening_delta:$opening_delta,baseline_fresh_sources:$baseline_fresh,final_fresh_sources:$final_fresh,fresh_source_delta:$fresh_delta}' \
            > evidence/result.json

          if [ "$verified_delta" -gt 0 ]; then
            state=success
            description="Verified jobs +${verified_delta}; ${final_verified} new in 24h; ${final_open} open"
          else
            state=failure
            description="Verified jobs did not increase; ${final_verified} new in 24h; ${final_open} open"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified job production sprint"
            echo "- Result: ${state}"
            echo "- Baseline new verified jobs: ${baseline_verified}"
            echo "- Final new verified jobs: ${final_verified}"
            echo "- Verified-job delta: ${verified_delta}"
            echo "- Active-family delta: ${family_delta}"
            echo "- Active-opening delta: ${opening_delta}"
            echo "- Fresh-source delta: ${fresh_delta}"
            echo ""
            echo "#### Cycle evidence"
            for file in evidence/cycle-*.txt; do
              echo '```text'
              cat "$file"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sprint status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.sprint.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.sprint.outputs.description || 'Verified job sprint did not complete' }}
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state "$STATE" \
            --arg context "gaia/verified-job-sprint" \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Upload sprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-sprint-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Fail if verified jobs did not increase
        if: always()
        run: test "${{ steps.sprint.outputs.state || 'failure' }}" = success
