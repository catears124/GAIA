name: Continuous inventory fallback

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: gaia-continuous-inventory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GAIA_DATABASE_URL: ${{ secrets.GAIA_DATABASE_URL }}
      GAIA_GITHUB_TOKEN: ${{ secrets.GAIA_GITHUB_TOKEN }}
      GAIA_WORKER_CONCURRENCY: "12"
      GAIA_WORKDAY_FULL_INVENTORY: "1"
      GAIA_WORKDAY_MAX_PER_TERM: "20000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: gaia migrate
      - name: Drain due inventory work
        run: gaia worker --once --budget-seconds 720
