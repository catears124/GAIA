name: Production inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory.yml"
      - "src/gaia/**"
      - "pyproject.toml"
  schedule:
    # One worker every five minutes. A single runner is intentionally used instead
    # of a ten-runner matrix so hosted-runner pressure cannot cancel the whole pulse.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "Maximum crawl time for this pulse"
        required: false
        default: "150"

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-inventory-continuous
  # Never kill a live crawl. GitHub retains the newest pending pulse if one overlaps.
  cancel-in-progress: false

jobs:
  pulse:
    name: Continuous inventory and instant Discord delivery
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_PRISMA_URL || secrets.POSTGRES_URL || secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "180"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "35"
      GAIA_CRAWL_LEASE_SECONDS: "300"
      GAIA_ENABLE_DISCOVERY: "0"
      GAIA_SKIP_CATALOG_SYNC: "1"
      GAIA_DEFER_FAMILY_REBUILD: "1"
      GAIA_WORKER_KINDS: "greenhouse,lever,ashby,smartrecruiters,recruitee,workable,workday-search,oracle-cloud,jobvite,icims,successfactors,domain,verification,google-careers"
      GAIA_WORKDAY_FULL_INVENTORY: "0"
      GAIA_WORKDAY_MAX_PER_TERM: "1200"
      GAIA_WORKDAY_GLOBAL_CONCURRENCY: "2"
      GAIA_WORKDAY_MIN_INTERVAL: "0.5"
      GAIA_DISCORD_BOOTSTRAP_LOOKBACK_MINUTES: "180"
      GAIA_DISCORD_MAX_PER_CHANNEL: "250"
      VERIFIED_DHOOK: ${{ secrets.VERIFIED_DHOOK }}
      LEADS_DHOOK: ${{ secrets.LEADS_DHOOK }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .

      - name: Crawl continuously and deliver committed jobs immediately
        id: pulse
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence

          set +e
          python -m gaia.wait_for_database --timeout-seconds 45 \
            > evidence/database-gate.log 2>&1
          database_code=$?
          set -e

          if [ "$database_code" -ne 0 ]; then
            echo "Actions database connection unavailable; using the live runtime fallback."
            status=$(curl --silent --show-error --location \
              --request POST \
              --user-agent "GAIA-production-maintenance/${GITHUB_RUN_ID}" \
              --connect-timeout 8 --max-time 30 \
              --retry 2 --retry-all-errors --retry-delay 2 \
              --output evidence/runtime-fallback.json \
              --write-out '%{http_code}' \
              https://gaiajob.vercel.app/api/maintenance/tick || printf '000')
            if [ "$status" = 200 ] && \
               jq -e 'type == "object" and (.status | IN("ok", "partial", "not_due"))' \
                 evidence/runtime-fallback.json >/dev/null; then
              echo "state=pending" >> "$GITHUB_OUTPUT"
              echo "description=Actions DB path unavailable; live runtime inventory pulse completed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Both Actions and live-runtime inventory paths failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ -z "$VERIFIED_DHOOK" ] || [ -z "$LEADS_DHOOK" ]; then
            echo "Both VERIFIED_DHOOK and LEADS_DHOOK are required for instant delivery." >&2
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Discord webhook configuration is incomplete" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # The notification pump reads committed postings directly. It does not wait
          # for the worker batch or the materialized families table to be rebuilt.
          python -m gaia.discord_notify \
            --watch --interval-seconds 2 --max-seconds 390 \
            > evidence/discord-watch.log 2>&1 &
          notifier_pid=$!

          stop_notifier() {
            kill "$notifier_pid" 2>/dev/null || true
            wait "$notifier_pid" 2>/dev/null || true
          }
          trap stop_notifier EXIT INT TERM
          sleep 2
          if ! kill -0 "$notifier_pid" 2>/dev/null; then
            echo "Discord notification pump exited before crawling started." >&2
            cat evidence/discord-watch.log >&2 || true
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Discord notification pump failed to start" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          case "${{ github.event_name }}" in
            workflow_dispatch) budget="${{ inputs.budget_seconds }}" ;;
            *) budget="150" ;;
          esac

          set +e
          gaia worker --once --budget-seconds "$budget" --concurrency 24 \
            2>&1 | tee evidence/inventory.txt
          worker_code=${PIPESTATUS[0]}
          set -e

          # Publish the product feed only when this pulse changed inventory. Discord
          # delivery already happened from postings while the crawl was still running.
          changed=$(python - <<'PY'
          import ast
          from pathlib import Path

          lines = [line.strip() for line in Path("evidence/inventory.txt").read_text().splitlines()]
          payload = {}
          for line in reversed(lines):
              if line.startswith("{") and line.endswith("}"):
                  try:
                      candidate = ast.literal_eval(line)
                  except (SyntaxError, ValueError):
                      continue
                  if isinstance(candidate, dict):
                      payload = candidate
                      break
          print(int(payload.get("new", 0)) + int(payload.get("removed", 0)))
          PY
          )

          if [ "$changed" -gt 0 ]; then
            timeout 75 python - <<'PY' 2>&1 | tee evidence/feed-rebuild.log
          from gaia.db import Database
          Database(migrate=False).rebuild_families()
          print("Public families rebuilt after inventory change.")
          PY
          fi

          python -m gaia.discord_notify > evidence/discord-final.json
          stop_notifier
          trap - EXIT INT TERM

          if [ "$worker_code" -ne 0 ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Continuous inventory worker failed after committed partial progress" >> "$GITHUB_OUTPUT"
            exit "$worker_code"
          fi

          echo "state=success" >> "$GITHUB_OUTPUT"
          echo "description=Continuous inventory pulse completed; Discord delivery polled every 2 seconds" >> "$GITHUB_OUTPUT"

      - name: Upload pulse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-inventory-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish inventory pulse status
        if: always()
        shell: bash
        env:
          STATE: ${{ steps.pulse.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.pulse.outputs.description || 'Continuous inventory pulse did not complete' }}
        run: |
          payload=$(jq -n \
            --arg state "$STATE" \
            --arg context "gaia/production-inventory" \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
