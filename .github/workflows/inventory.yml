name: Production inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory.yml"
      - "src/gaia/**"
      - "pyproject.toml"
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "Maximum runtime per provider lane"
        required: false
        default: "900"

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-inventory
  # Scheduled runs can legitimately take longer than the cadence. Cancelling the
  # previous run repeatedly abandons leased sources and can permanently starve
  # the tail of the queue, so let overlapping runs coordinate through DB leases.
  cancel-in-progress: false

jobs:
  database_gate:
    name: Check production database readiness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    outputs:
      state: ${{ steps.gate.outputs.state }}
      exit_code: ${{ steps.gate.outputs.exit_code }}
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate database configuration
        id: config
        shell: bash
        run: |
          if [ -z "$GAIA_DATABASE_URL" ]; then
            echo "Missing GitHub Actions secret POSTGRES_URL." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install GAIA
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check -e .
      - name: Probe database once for the whole workflow
        id: gate
        shell: bash
        run: |
          if [ "${{ steps.config.outputs.configured }}" != true ]; then
            echo "state=invalid" >> "$GITHUB_OUTPUT"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python -m gaia.wait_for_database --timeout-seconds 600
          code=$?
          set -e

          case "$code" in
            0) state=ready ;;
            1) state=recovering ;;
            2) state=invalid ;;
            *) state=failed ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Database readiness classified as $state (exit $code)."

  repair:
    needs: database_gate
    if: github.event_name != 'schedule' && needs.database_gate.outputs.state == 'ready'
    name: Repair production query indexes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_MIGRATION_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase session connection
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL_NON_POOLING." >&2
            exit 1
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Repair postings indexes with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 600 python -m gaia.repair_indexes; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Index repair failed after three attempts." >&2
              exit 1
            fi
            python -m gaia.wait_for_database --timeout-seconds 180
          done

  inventory:
    needs: database_gate
    if: needs.database_gate.outputs.state == 'ready'
    name: Inventory · ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - lane: greenhouse-lever
            kinds: greenhouse,lever
            workers: 4
          - lane: ashby
            kinds: ashby
            workers: 3
          - lane: modern-ats
            kinds: smartrecruiters,recruitee,workable
            workers: 3
          - lane: workday-a
            kinds: workday-search
            workers: 3
          - lane: workday-b
            kinds: workday-search
            workers: 3
          - lane: workday-c
            kinds: workday-search
            workers: 3
          - lane: workday-d
            kinds: workday-search
            workers: 3
          - lane: oracle
            kinds: oracle-cloud
            workers: 4
          - lane: enterprise
            kinds: jobvite,icims,successfactors
            workers: 2
          - lane: fallback-google
            kinds: domain,verification,google-careers
            workers: 2
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_CRAWL_LEASE_SECONDS: "600"
      GAIA_ENABLE_DISCOVERY: "0"
      GAIA_SKIP_CATALOG_SYNC: "1"
      GAIA_DEFER_FAMILY_REBUILD: "1"
      GAIA_WORKER_KINDS: ${{ matrix.kinds }}
      GAIA_WORKDAY_FULL_INVENTORY: "0"
      GAIA_WORKDAY_MAX_PER_TERM: "1200"
      GAIA_WORKDAY_GLOBAL_CONCURRENCY: "2"
      GAIA_WORKDAY_MIN_INTERVAL: "0.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase pooler connection
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL." >&2
            exit 1
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Drain due employer boards with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) budget="${{ inputs.budget_seconds }}" ;;
            *) budget="480" ;;
          esac

          for attempt in 1 2 3; do
            echo "${{ matrix.lane }} attempt ${attempt}/3 with ${budget}s budget"
            if gaia worker \
              --once \
              --budget-seconds "$budget" \
              --concurrency "${{ matrix.workers }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "${{ matrix.lane }} failed after three attempts." >&2
              exit 1
            fi
            python -m gaia.wait_for_database --timeout-seconds 180
          done

  status:
    name: Publish inventory pulse status
    needs: [database_gate, repair, inventory]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish final commit status
        shell: bash
        run: |
          gate="${{ needs.database_gate.outputs.state }}"
          state=success
          description="All provider inventory lanes completed"
          if [ "$gate" = invalid ]; then
            state=failure
            description="Production database configuration or credentials are invalid"
          elif [ "$gate" = recovering ]; then
            state=pending
            description="Database recovery active; inventory fanout suppressed"
          elif [ "$gate" = failed ]; then
            state=failure
            description="Database readiness probe failed unexpectedly"
          elif [ "$gate" != ready ]; then
            state=failure
            description="Database readiness gate did not complete"
          elif [ "${{ needs.inventory.result }}" != success ]; then
            state=failure
            description="One or more provider inventory lanes failed after retries"
          elif [ "${{ needs.repair.result }}" != success ] && [ "${{ needs.repair.result }}" != skipped ]; then
            state=failure
            description="Production index repair failed"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/production-inventory" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
