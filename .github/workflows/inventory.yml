name: Production inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory.yml"
      - "src/gaia/repair_indexes.py"
      - "src/gaia/inventory.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/live_inventory.py"
      - "src/gaia/db_write.py"
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "Maximum runtime per provider lane"
        required: false
        default: "900"

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-production-inventory
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  repair:
    name: Repair production query indexes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_MIGRATION_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase session connection
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL_NON_POOLING." >&2
            exit 1
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Repair postings indexes
        run: python -m gaia.repair_indexes

  inventory:
    name: Inventory · ${{ matrix.lane }}
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: fast-a
            kinds: greenhouse,lever,ashby,smartrecruiters,recruitee,workable,google-careers
            workers: 2
          - lane: fast-b
            kinds: greenhouse,lever,ashby,smartrecruiters,recruitee,workable,google-careers
            workers: 2
          - lane: enterprise-fallback
            kinds: jobvite,icims,oracle-cloud,successfactors,domain,verification
            workers: 1
          - lane: workday
            kinds: workday-search
            workers: 1
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "0"
      GAIA_SKIP_CATALOG_SYNC: "1"
      GAIA_DEFER_FAMILY_REBUILD: "1"
      GAIA_WORKER_KINDS: ${{ matrix.kinds }}
      GAIA_WORKDAY_FULL_INVENTORY: "1"
      GAIA_WORKDAY_MAX_PER_TERM: "20000"
      GAIA_WORKDAY_GLOBAL_CONCURRENCY: "1"
      GAIA_WORKDAY_MIN_INTERVAL: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase session connection
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL_NON_POOLING." >&2
            exit 1
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Drain due employer boards
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) budget="${{ inputs.budget_seconds }}" ;;
            *) budget="480" ;;
          esac
          gaia worker \
            --once \
            --budget-seconds "$budget" \
            --concurrency "${{ matrix.workers }}"

  status:
    name: Publish inventory pulse status
    needs: inventory
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish final commit status
        shell: bash
        run: |
          state=success
          description="Provider inventory pulse completed"
          case "${{ needs.inventory.result }}" in
            success)
              ;;
            cancelled)
              state=pending
              description="Provider pulse superseded by recovery"
              ;;
            *)
              state=failure
              description="One or more provider inventory lanes failed"
              ;;
          esac
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/production-inventory" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
