name: Production inventory

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: "2,17,32,47 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "Maximum runtime per crawler lane"
        required: false
        default: "3000"

# Matrix jobs provide horizontal fan-out inside one run. Serializing whole runs prevents
# a long catch-up batch from spawning a second Workday lane while the first is active.
concurrency:
  group: gaia-production-inventory
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  prepare:
    name: Migrate and prepare distributed queue
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_MIGRATION_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "0"
      GAIA_WORKER_KINDS: __prepare_only__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase URLs
        shell: bash
        run: |
          if [ -z "$GAIA_DATABASE_URL" ]; then
            echo "Missing GitHub Actions secret POSTGRES_URL." >&2
            exit 1
          fi
          if [ -z "$GAIA_MIGRATION_DATABASE_URL" ]; then
            echo "Missing GitHub Actions secret POSTGRES_URL_NON_POOLING." >&2
            exit 1
          fi
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Apply production schema
        run: gaia migrate
      - name: Reconcile validated sources into the crawl queue
        run: gaia worker --once --budget-seconds 1 --concurrency 1

  inventory:
    name: Inventory · ${{ matrix.lane }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 58
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - lane: fast-a
            kinds: greenhouse,lever,ashby,smartrecruiters,recruitee,workable,google-careers
            workers: 24
          - lane: fast-b
            kinds: greenhouse,lever,ashby,smartrecruiters,recruitee,workable,google-careers
            workers: 24
          - lane: fast-c
            kinds: greenhouse,lever,ashby,smartrecruiters,recruitee,workable,google-careers
            workers: 24
          - lane: enterprise-a
            kinds: jobvite,icims,oracle-cloud,successfactors
            workers: 8
          - lane: enterprise-b
            kinds: jobvite,icims,oracle-cloud,successfactors
            workers: 8
          - lane: workday
            kinds: workday-search
            workers: 2
          - lane: fallback
            kinds: domain,verification
            workers: 8
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "0"
      GAIA_SKIP_CATALOG_SYNC: "1"
      GAIA_WORKER_KINDS: ${{ matrix.kinds }}
      GAIA_WORKDAY_FULL_INVENTORY: "1"
      GAIA_WORKDAY_MAX_PER_TERM: "20000"
      GAIA_WORKDAY_GLOBAL_CONCURRENCY: "1"
      GAIA_WORKDAY_MIN_INTERVAL: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Drain due employer boards
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) budget="${{ inputs.budget_seconds }}" ;;
            push) budget="3000" ;;
            *) budget="660" ;;
          esac
          gaia worker \
            --once \
            --budget-seconds "$budget" \
            --concurrency "${{ matrix.workers }}"

  discovery:
    name: Candidate discovery and validation
    needs: inventory
    if: ${{ always() && needs.inventory.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "1"
      GAIA_WORKER_KINDS: __discovery_only__
      GAIA_CANDIDATE_PROBE_LIMIT: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Refresh evidence and validate candidate boards
        run: gaia worker --once --budget-seconds 600 --concurrency 16

  health:
    name: Verify production inventory
    needs: [prepare, inventory, discovery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_CHECK_MAX_ACTIVITY_MINUTES: "90"
      GAIA_CHECK_MIN_SOURCES: "100"
      GAIA_CHECK_MIN_ACTIVE_LISTINGS: "25"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - id: production_check
        name: Check Supabase inventory and product read model
        continue-on-error: true
        run: gaia check --output production-health.json
      - name: Publish health report
        if: always()
        shell: bash
        run: |
          echo "### Production inventory health" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -f production-health.json ]; then
            cat production-health.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"ok": false, "errors": ["checker produced no report"]}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health
          path: production-health.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish commit status
        if: always()
        shell: bash
        run: |
          state=success
          description="Inventory healthy"
          if [ "${{ needs.prepare.result }}" != "success" ] || \
             [ "${{ needs.inventory.result }}" != "success" ] || \
             [ "${{ steps.production_check.outcome }}" != "success" ]; then
            state=failure
            description="Inventory, migration, or health check failed"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/production-inventory" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
      - name: Require healthy production
        if: always()
        shell: bash
        run: |
          if [ "${{ needs.prepare.result }}" != "success" ]; then
            echo "Queue preparation or migration failed." >&2
            exit 1
          fi
          if [ "${{ needs.inventory.result }}" != "success" ]; then
            echo "One or more inventory lanes failed." >&2
            exit 1
          fi
          if [ "${{ steps.production_check.outcome }}" != "success" ]; then
            echo "Production health checker failed." >&2
            exit 1
          fi
