name: Production inventory

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "Maximum runtime per provider lane"
        required: false
        default: "900"

permissions:
  contents: read
  statuses: write

jobs:
  inventory:
    name: Inventory · ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: gaia-production-inventory-${{ matrix.lane }}
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - lane: fast-a
            kinds: greenhouse,lever,ashby,smartrecruiters,recruitee,workable,google-careers
            workers: 8
          - lane: fast-b
            kinds: greenhouse,lever,ashby,smartrecruiters,recruitee,workable,google-careers
            workers: 8
          - lane: fast-c
            kinds: greenhouse,lever,ashby,smartrecruiters,recruitee,workable,google-careers
            workers: 8
          - lane: enterprise-a
            kinds: jobvite,icims,oracle-cloud,successfactors
            workers: 4
          - lane: enterprise-b
            kinds: jobvite,icims,oracle-cloud,successfactors
            workers: 4
          - lane: workday
            kinds: workday-search
            workers: 2
          - lane: fallback
            kinds: domain,verification
            workers: 4
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "0"
      GAIA_SKIP_CATALOG_SYNC: "1"
      GAIA_DEFER_FAMILY_REBUILD: "1"
      GAIA_WORKER_KINDS: ${{ matrix.kinds }}
      GAIA_WORKDAY_FULL_INVENTORY: "1"
      GAIA_WORKDAY_MAX_PER_TERM: "20000"
      GAIA_WORKDAY_GLOBAL_CONCURRENCY: "1"
      GAIA_WORKDAY_MIN_INTERVAL: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase connection
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL." >&2
            exit 1
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Drain due employer boards
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) budget="${{ inputs.budget_seconds }}" ;;
            *) budget="480" ;;
          esac
          gaia worker \
            --once \
            --budget-seconds "$budget" \
            --concurrency "${{ matrix.workers }}"

  status:
    name: Publish inventory pulse status
    needs: inventory
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish final commit status
        shell: bash
        run: |
          state=success
          description="Provider inventory pulse completed"
          if [ "${{ needs.inventory.result }}" != "success" ]; then
            state=failure
            description="One or more provider inventory lanes failed"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/production-inventory" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
