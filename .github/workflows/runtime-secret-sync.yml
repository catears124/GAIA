name: Sync runtime Discord secrets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-secret-sync.yml"
      - "src/gaia/runtime_secrets.py"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaia-runtime-secret-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_PRISMA_URL || secrets.POSTGRES_URL || secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "60"
      VERIFIED_DHOOK: ${{ secrets.VERIFIED_DHOOK }}
      LEADS_DHOOK: ${{ secrets.LEADS_DHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Persist protected runtime webhook copies
        run: |
          test -n "$GAIA_DATABASE_URL"
          test -n "$VERIFIED_DHOOK"
          test -n "$LEADS_DHOOK"
          python -m gaia.wait_for_database --timeout-seconds 45
          python -m gaia.runtime_secrets
