name: Apply family projection patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/streamline-family-rebuild' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/streamline-family-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply projection patch
        run: python .github/patch_family_projection.py
      - name: Commit code and tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gaia/db_write.py tests/test_family_rebuild_projection.py
          git commit -m 'Project only family rebuild columns' || exit 0
          git push origin HEAD:agent/streamline-family-rebuild
