name: Apply recency and health patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-recency-health' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-recency-health
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed patch
        run: python .github/patch_recency_health.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Fix recency sorting and production freshness' || exit 0
          git push origin HEAD:agent/fix-recency-health
