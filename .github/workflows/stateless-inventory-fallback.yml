name: Stateless inventory fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stateless-inventory-fallback.yml"
      - "src/gaia/default_sources.yaml"
      - "src/gaia/stateless_hot_inventory.py"
      - "src/gaia/stateless_inventory.py"
      - "src/gaia/smb_ats_collectors.py"
      - "src/gaia/platform_sitemap_census.py"
      - "src/gaia/database_failover.py"
      - "tests/test_stateless_hot_inventory.py"
      - "tests/test_smb_ats_collectors.py"
      - "tests/test_stateless_inventory.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run stateless refresh even if Postgres is reachable"
        required: false
        default: "false"

permissions:
  contents: write
  statuses: write

concurrency:
  group: gaia-stateless-inventory-fallback
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh public snapshot without Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING || secrets.POSTGRES_URL || secrets.POSTGRES_PRISMA_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_STATELESS_HOT_CONCURRENCY: "32"
      GAIA_STATELESS_HOT_MAX_COLLECTORS: "500"
      GAIA_STATELESS_HOT_SCHEMA_LIMIT: "120"
      GAIA_STATELESS_HOT_WORKDAY_LIMIT: "24"
      GAIA_STATELESS_SHARDS: "16"
      GAIA_STATELESS_BATCH_SHARDS: "4"
      GAIA_STATELESS_CONCURRENCY: "48"
      GAIA_STATELESS_HTTP_TIMEOUT: "15"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GAIA and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify stateless fallback lanes
        run: |
          set -euo pipefail
          ruff check \
            src/gaia/smb_ats_collectors.py \
            src/gaia/stateless_hot_inventory.py \
            src/gaia/stateless_inventory.py \
            tests/test_smb_ats_collectors.py \
            tests/test_stateless_hot_inventory.py \
            tests/test_stateless_inventory.py
          pytest -q \
            tests/test_smb_ats_collectors.py \
            tests/test_stateless_hot_inventory.py \
            tests/test_stateless_inventory.py

      - name: Check whether primary Postgres path is healthy
        id: db
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m gaia.database_failover \
            --timeout-seconds 12 \
            --connect-timeout 4 \
            --max-delay-seconds 2 \
            --json-output stateless-db-probe.json

      - name: Decide fallback activation
        id: gate
        shell: bash
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          if [ "$FORCE" = true ] || [ "${{ steps.db.outcome }}" != success ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore durable public inventory
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p src/gaia/frontend
          git fetch origin snapshot-data
          git show origin/snapshot-data:src/gaia/frontend/last-known-inventory.json \
            > src/gaia/frontend/last-known-inventory.json
          test -s src/gaia/frontend/last-known-inventory.json

      - name: Refresh high-yield 2027 registries and employer sources
        if: steps.gate.outputs.run == 'true'
        id: hot
        shell: bash
        run: |
          set -euo pipefail
          rm -f stateless-hot-summary.json
          if timeout --signal=TERM --kill-after=15s 480s \
            python -m gaia.stateless_hot_inventory \
              --previous src/gaia/frontend/last-known-inventory.json \
              --output src/gaia/frontend/last-known-inventory.json \
              --concurrency "$GAIA_STATELESS_HOT_CONCURRENCY" \
            | tee stateless-hot-summary.json; then
            description=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("stateless-hot-summary.json").read_text())
          print(
              f"Hot: registries={data.get('registry_sources', 0)} "
              f"leads={data.get('registry_target_postings', 0)} "
              f"direct_sources={data.get('direct_sources', 0)} "
              f"verified={data.get('direct_target_postings', 0)}"
          )
          PY
            )
            echo "description=${description:0:140}" >> "$GITHUB_OUTPUT"
          else
            echo "High-yield stateless refresh failed; keeping durable snapshot and continuing long-tail sweep." >&2
            rm -f stateless-hot-summary.json
            echo "description=Hot refresh failed; long-tail fallback continued" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh complete-feed tenant census
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m gaia.platform_sitemap_census \
            --snapshot-output platform-sitemap-census.json \
            | tee platform-sitemap-summary.json

      - name: Refresh tenant shards directly
        if: steps.gate.outputs.run == 'true'
        id: stateless
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          shard_list=$(python - <<'PY'
          import os
          from datetime import UTC, datetime

          shards = max(1, int(os.environ.get("GAIA_STATELESS_SHARDS", "16")))
          batch = max(1, min(shards, int(os.environ.get("GAIA_STATELESS_BATCH_SHARDS", "4"))))
          slot = int(datetime.now(UTC).timestamp() // 300)
          batches = max(1, (shards + batch - 1) // batch)
          start = (slot % batches) * batch
          print(" ".join(str(index) for index in range(start, min(start + batch, shards))))
          PY
          )
          if [[ "$COMMIT_MESSAGE" == *"[full-sweep]"* ]]; then
            shard_list=$(seq 0 $((GAIA_STATELESS_SHARDS - 1)))
            echo "Bootstrap full stateless sweep enabled."
          else
            echo "Refreshing bounded stateless batch: $shard_list"
          fi

          rm -rf stateless-summaries
          mkdir -p stateless-summaries
          successes=0
          for shard in $shard_list; do
            echo "Refreshing stateless shard $shard/$GAIA_STATELESS_SHARDS"
            if timeout --signal=TERM --kill-after=15s 610s \
              python -m gaia.stateless_inventory \
                --census platform-sitemap-census.json \
                --previous src/gaia/frontend/last-known-inventory.json \
                --output src/gaia/frontend/last-known-inventory.json \
                --shards "$GAIA_STATELESS_SHARDS" \
                --shard-index "$shard" \
                --concurrency "$GAIA_STATELESS_CONCURRENCY" \
              | tee "stateless-summaries/shard-${shard}.json"; then
              successes=$((successes + 1))
            else
              echo "Shard $shard failed; preserving its previous snapshot rows and continuing." >&2
              rm -f "stateless-summaries/shard-${shard}.json"
            fi
          done
          test "$successes" -gt 0

          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path("stateless-summaries").glob("shard-*.json")):
              try:
                  rows.append(json.loads(path.read_text()))
              except (OSError, json.JSONDecodeError):
                  continue
          if not rows:
              raise SystemExit("no successful stateless shard summaries")
          aggregate = {
              "shards_run": [row.get("shard") for row in rows],
              "shards_succeeded": len(rows),
              "shards": rows[-1].get("shards"),
              "selected_sources": sum(int(row.get("selected_sources", 0)) for row in rows),
              "refreshed_sources": sum(int(row.get("refreshed_sources", 0)) for row in rows),
              "target_postings": sum(int(row.get("target_postings", 0)) for row in rows),
              "families": rows[-1].get("families"),
          }
          hot = Path("stateless-hot-summary.json")
          if hot.exists():
              try:
                  hot_data = json.loads(hot.read_text())
              except (OSError, json.JSONDecodeError):
                  hot_data = {}
              aggregate["hot_registry_targets"] = int(hot_data.get("registry_target_postings", 0))
              aggregate["hot_direct_targets"] = int(hot_data.get("direct_target_postings", 0))
              aggregate["hot_direct_sources"] = int(hot_data.get("direct_sources", 0))
          Path("stateless-inventory-summary.json").write_text(
              json.dumps(aggregate, sort_keys=True) + "\n"
          )
          print(json.dumps(aggregate, sort_keys=True))
          PY

          description=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("stateless-inventory-summary.json").read_text())
          print(
              f"Hot verified={data.get('hot_direct_targets', 0)} "
              f"leads={data.get('hot_registry_targets', 0)}; "
              f"longtail targets={data.get('target_postings', 0)} "
              f"sources={data.get('refreshed_sources', 0)}/{data.get('selected_sources', 0)}"
          )
          PY
          )
          echo "description=${description:0:140}" >> "$GITHUB_OUTPUT"

      - name: Validate public snapshot contract
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from gaia.snapshot_validation import validate_snapshot_file
          report = validate_snapshot_file(
              Path("src/gaia/frontend/last-known-inventory.json"),
              max_age_hours=1,
          )
          print(
              f"roles={report.roles} expected={report.expected_roles} "
              f"age_hours={report.age_hours:.3f} size_mb={report.size_mb:.2f}"
          )
          PY

      - name: Publish refreshed snapshot to data-only branch
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          cp src/gaia/frontend/last-known-inventory.json /tmp/last-known-inventory.json
          git fetch origin snapshot-data
          rm -rf /tmp/gaia-stateless-data
          git worktree add /tmp/gaia-stateless-data origin/snapshot-data
          destination=/tmp/gaia-stateless-data/src/gaia/frontend/last-known-inventory.json
          mkdir -p "$(dirname "$destination")"
          cp /tmp/last-known-inventory.json "$destination"
          cd /tmp/gaia-stateless-data
          if git diff --quiet -- src/gaia/frontend/last-known-inventory.json; then
            echo "Stateless snapshot unchanged."
            exit 0
          fi
          git config user.name "gaia-stateless-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/gaia/frontend/last-known-inventory.json
          git commit -m "data: stateless high-yield and direct-source inventory refresh"
          for attempt in 1 2 3; do
            if git pull --rebase origin snapshot-data && git push origin HEAD:snapshot-data; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload stateless evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateless-inventory-${{ github.run_id }}
          path: |
            stateless-db-probe.json
            stateless-hot-summary.json
            platform-sitemap-census.json
            platform-sitemap-summary.json
            stateless-inventory-summary.json
            stateless-summaries/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish fallback status
        if: always()
        env:
          DESCRIPTION: ${{ steps.stateless.outputs.description || steps.hot.outputs.description || 'Stateless fallback not required or did not complete' }}
        run: |
          if [ "${{ steps.gate.outputs.run }}" != true ]; then
            state=success
            description="Primary Postgres reachable; stateless fallback idle"
          elif [ "${{ steps.stateless.outcome }}" = success ]; then
            state=success
            description="$DESCRIPTION"
          else
            state=failure
            description="Stateless direct-source inventory refresh failed"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context gaia/stateless-inventory \
            --arg description "${description:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
