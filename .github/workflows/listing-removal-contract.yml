name: Listing removal contract

on:
  pull_request:
    paths:
      - ".github/workflows/listing-removal-contract.yml"
      - "app.py"
      - "src/gaia/activity_api.py"
      - "src/gaia/db.py"
      - "src/gaia/removal_guard.py"
      - "tests/test_durable_activity_stats.py"
      - "tests/test_listing_removal_guard.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/listing-removal-contract.yml"
      - "app.py"
      - "src/gaia/activity_api.py"
      - "src/gaia/db.py"
      - "src/gaia/removal_guard.py"
      - "tests/test_durable_activity_stats.py"
      - "tests/test_listing_removal_guard.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listing-removal-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaia_listing_removal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaia_listing_removal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GAIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_listing_removal
      GAIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_listing_removal
      GAIA_INITIAL_SYNC: "0"
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: gaia migrate
      - name: Lint removal safeguards
        run: >-
          ruff check
          app.py
          src/gaia/activity_api.py
          src/gaia/db.py
          src/gaia/removal_guard.py
          tests/test_durable_activity_stats.py
          tests/test_listing_removal_guard.py
      - name: Verify removal safeguards
        run: >-
          pytest -q
          tests/test_listing_removal_guard.py
          tests/test_durable_activity_stats.py
          tests/test_product_stats_units.py
