name: Emergency production repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-repair.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: gaia-emergency-production-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Repair database and restart inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_MIGRATION_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending repair status
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state "pending" \
            --arg context "gaia/emergency-repair" \
            --arg description "Verifying repaired indexes and launching recovery" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase connections
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL"
          test -n "$GAIA_MIGRATION_DATABASE_URL"
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify production query indexes
        run: python -m gaia.repair_indexes
      - name: Dispatch clean inventory recovery
        run: gh workflow run inventory.yml --ref main -f budget_seconds=900
      - name: Publish successful repair status
        if: success()
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state "success" \
            --arg context "gaia/emergency-repair" \
            --arg description "Indexes ready; inventory recovery dispatched" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
      - name: Publish failed repair status
        if: failure()
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state "failure" \
            --arg context "gaia/emergency-repair" \
            --arg description "Emergency production repair failed" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
