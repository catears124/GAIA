name: Production maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maintenance.yml"
      - "src/gaia/repair_indexes.py"
      - "src/gaia/source_catalog.py"
      - "src/gaia/discovery.py"
      - "src/gaia/provider_discovery.py"
      - "src/gaia/employer_census.py"
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-production-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    name: Migrate and maintain source queue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_MIGRATION_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "0"
      GAIA_DEFER_FAMILY_REBUILD: "1"
      GAIA_WORKER_KINDS: __prepare_only__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase URLs
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL." >&2
            exit 1
          }
          test -n "$GAIA_MIGRATION_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL_NON_POOLING." >&2
            exit 1
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Repair postings indexes
        run: python -m gaia.repair_indexes
      - name: Apply production schema
        run: gaia migrate
      - name: Reconcile validated sources into the crawl queue
        run: gaia worker --once --budget-seconds 1 --concurrency 1

  discovery:
    name: Employer census and source validation
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "1"
      GAIA_DEFER_FAMILY_REBUILD: "1"
      GAIA_WORKER_KINDS: __discovery_only__
      GAIA_CANDIDATE_PROBE_LIMIT: "64"
      GAIA_EMPLOYER_PROFILE_PROBE_LIMIT: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Refresh evidence and validate candidate sources
        run: gaia worker --once --budget-seconds 600 --concurrency 12

  status:
    name: Publish maintenance status
    needs: [prepare, discovery]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish final commit status
        shell: bash
        run: |
          state=success
          description="Source queue and employer census maintained"
          if [ "${{ needs.prepare.result }}" != "success" ] || \
             [ "${{ needs.discovery.result }}" != "success" ]; then
            state=failure
            description="Production maintenance or discovery failed"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/production-maintenance" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
