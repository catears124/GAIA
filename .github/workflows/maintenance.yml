name: Production maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maintenance.yml"
      - "src/gaia/repair_indexes.py"
      - "src/gaia/source_catalog.py"
      - "src/gaia/discovery.py"
      - "src/gaia/provider_discovery.py"
      - "src/gaia/employer_census.py"
      - "src/gaia/wait_for_database.py"
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-production-maintenance
  cancel-in-progress: true

jobs:
  readiness:
    name: Gate maintenance on database readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    outputs:
      state: ${{ steps.gate.outputs.state }}
      ready: ${{ steps.gate.outputs.ready }}
      configuration_valid: ${{ steps.gate.outputs.configuration_valid }}
      exit_code: ${{ steps.gate.outputs.exit_code }}
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_PRISMA_URL || secrets.POSTGRES_URL || secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate configuration and classify PostgreSQL readiness
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "$GAIA_DATABASE_URL" ]; then
            echo "state=invalid" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "configuration_valid=false" >> "$GITHUB_OUTPUT"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            echo "Missing all supported database secrets: POSTGRES_PRISMA_URL, POSTGRES_URL, POSTGRES_URL_NON_POOLING." >&2
            exit 0
          fi
          python -m pip install --disable-pip-version-check -e . >/dev/null
          set +e
          python -m gaia.wait_for_database --timeout-seconds 120
          code=$?
          set -e
          case "$code" in
            0) state=ready; ready=true; configuration_valid=true ;;
            1) state=recovering; ready=false; configuration_valid=true ;;
            2) state=invalid; ready=false; configuration_valid=false ;;
            *) state=failed; ready=false; configuration_valid=true ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "configuration_valid=$configuration_valid" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Database readiness classified as $state (exit $code)."

  prepare:
    name: Migrate and maintain source queue
    needs: readiness
    if: needs.readiness.outputs.state == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_PRISMA_URL || secrets.POSTGRES_URL || secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_MIGRATION_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING || secrets.POSTGRES_PRISMA_URL || secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "120"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "0"
      GAIA_DEFER_FAMILY_REBUILD: "1"
      GAIA_WORKER_KINDS: __prepare_only__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require migration database URL
        run: test -n "$GAIA_MIGRATION_DATABASE_URL"
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Repair postings indexes
        run: python -m gaia.repair_indexes
      - name: Apply production schema
        run: gaia migrate
      - name: Reconcile validated sources into the crawl queue
        run: gaia worker --once --budget-seconds 1 --concurrency 1

  discovery:
    name: Employer census and source validation
    needs: [readiness, prepare]
    if: needs.readiness.outputs.state == 'ready' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_PRISMA_URL || secrets.POSTGRES_URL || secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "120"
      GAIA_READ_ONLY: "0"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_ENABLE_DISCOVERY: "1"
      GAIA_DEFER_FAMILY_REBUILD: "1"
      GAIA_WORKER_KINDS: __discovery_only__
      GAIA_CANDIDATE_PROBE_LIMIT: "64"
      GAIA_EMPLOYER_PROFILE_PROBE_LIMIT: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Refresh evidence and validate candidate sources
        run: gaia worker --once --budget-seconds 600 --concurrency 12

  status:
    name: Publish maintenance status
    needs: [readiness, prepare, discovery]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish final commit status
        shell: bash
        run: |
          gate="${{ needs.readiness.outputs.state }}"
          state=success
          description="Source queue and employer census maintained"
          if [ "$gate" = invalid ]; then
            state=failure
            description="Production maintenance database configuration or credentials are invalid"
          elif [ "$gate" = recovering ]; then
            state=pending
            description="Database recovery active; production maintenance suppressed"
          elif [ "$gate" = failed ]; then
            state=failure
            description="Production maintenance readiness probe failed unexpectedly"
          elif [ "$gate" != ready ]; then
            state=failure
            description="Production maintenance readiness gate did not complete"
          elif [ "${{ needs.prepare.result }}" != "success" ] || [ "${{ needs.discovery.result }}" != "success" ]; then
            state=failure
            description="Production maintenance or discovery failed"
          fi
          payload=$(jq -n --arg state "$state" --arg context "gaia/production-maintenance" --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
