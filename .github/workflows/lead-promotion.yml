name: Lead promotion to verified jobs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lead-promotion.yml"
      - "src/gaia/autonomous_delivery.py"
      - "src/gaia/runtime_lead_verification.py"
      - "src/gaia/discord_notify.py"
      - "src/gaia/discord_notify_fast.py"
      - "src/gaia/continuous_runtime_api.py"
      - "src/gaia/db.py"
      - "src/gaia/db_write.py"
      - "src/gaia/page_verification.py"
      - "src/gaia/schema.sql"
  schedule:
    # GitHub's minimum reliable schedule cadence is five minutes. This path talks
    # directly to Supabase and Discord and does not depend on Vercel being healthy.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-lead-promotion-continuous
  # A newer five-minute pulse is more useful than allowing a pool-starved predecessor
  # to occupy the only delivery slot until its timeout.
  cancel-in-progress: true

jobs:
  promote:
    name: Direct DB verification and Discord delivery
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    env:
      # Background workers must bypass Supavisor transaction-pool checkout contention.
      # Prefer the direct Postgres endpoint; keep pooled URLs only as fallbacks for old
      # environments where the non-pooling secret has not been provisioned yet.
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING || secrets.POSTGRES_URL || secrets.POSTGRES_PRISMA_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "120"
      GAIA_DISCORD_BOOTSTRAP_LOOKBACK_MINUTES: "180"
      GAIA_DISCORD_MAX_PER_CHANNEL: "250"
      VERIFIED_DHOOK: ${{ secrets.VERIFIED_DHOOK }}
      LEADS_DHOOK: ${{ secrets.LEADS_DHOOK }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .

      - name: Require autonomous production dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GAIA_DATABASE_URL"
          test -n "$VERIFIED_DHOOK"
          test -n "$LEADS_DHOOK"

      - name: Verify, publish, and drain Discord directly
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # Let the worker own database attempts instead of aborting at a separate
          # readiness gate. Its notification path is deliberately independent of Vercel.
          python -m gaia.autonomous_delivery \
            --limit 12 --concurrency 6 --timeout-seconds 150 \
            | tee evidence/result.json
          description=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("evidence/result.json").read_text())
          verify = payload.get("verification") or {}
          notify = payload.get("notifications") or {}
          channels = notify.get("channels") or notify
          print(
              "Direct delivery: "
              f"selected {verify.get('selected_leads', 0)}, "
              f"verified {verify.get('verified_leads', 0)}, "
              f"recovered {verify.get('recovered_verified_openings', 0)}, "
              f"notifications {channels}"
          )
          PY
          )
          echo "description=${description:0:140}" >> "$GITHUB_OUTPUT"

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-promotion-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish lead-promotion status
        if: always()
        shell: bash
        env:
          DESCRIPTION: ${{ steps.delivery.outputs.description || 'Direct verification/Discord delivery failed' }}
        run: |
          if [ "${{ steps.delivery.outcome }}" = success ]; then
            state=success
          else
            state=failure
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/lead-promotion" \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
