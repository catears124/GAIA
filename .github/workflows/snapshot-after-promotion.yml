name: Snapshot after promotion

on:
  workflow_run:
    workflows:
      - "Candidate source drain"
      - "Lead promotion to verified jobs"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: gaia-snapshot-after-promotion
  cancel-in-progress: true

jobs:
  dispatch:
    name: Refresh snapshot after committed promotions
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch static snapshot publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg ref main '{ref:$ref}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/static-snapshot.yml/dispatches" \
            -d "$payload"
