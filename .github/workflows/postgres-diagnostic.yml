name: PostgreSQL diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GAIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_INITIAL_SYNC: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== install ==='
            python -m pip install -e ".[dev]"
            echo "install_exit=$?"
            echo '=== migrate ==='
            gaia migrate
            echo "migrate_exit=$?"
            echo '=== ruff ==='
            ruff check .
            echo "ruff_exit=$?"
            echo '=== pytest ==='
            pytest -q
            echo "pytest_exit=$?"
          } > diagnostic.log 2>&1
          cat diagnostic.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-diagnostic
          path: diagnostic.log
