name: Verified job conversion funnel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/conversion-funnel.yml"
      - "src/gaia/conversion_funnel.py"
      - "src/gaia/conversion_diagnostics_api.py"
      - "src/gaia/fast_candidate_drain.py"
      - "src/gaia/lead_promotion.py"
      - "src/gaia/fresh_lead_retry.py"
      - "src/gaia/db.py"
      - "src/gaia/db_write.py"
      - "src/gaia/page_verification.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/schema.sql"
      - "app.py"
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-conversion-funnel-v9-bounded-yield
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Capture baseline, exploit bounded candidate yield, and verify
        id: funnel
        env:
          BASE_URL: https://gaiajob.vercel.app
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"

          get_optional() {
            local name="$1" url="$2" max_time="${3:-120}"
            local code
            code=$(curl --silent --show-error --location --user-agent "$ua" \
              --connect-timeout 15 --max-time "$max_time" \
              --output "evidence/${name}.json" --write-out '%{http_code}' "$url" || printf '000')
            printf '%s\n' "$code" > "evidence/${name}.status"
          }

          post_json() {
            local name="$1" url="$2" max_time="${3:-55}"
            local code
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time "$max_time" \
              --output "evidence/${name}.json" --write-out '%{http_code}' "$url" || printf '000')
            printf '%s\n' "$code" > "evidence/${name}.status"
          }

          # The full diagnostic is evidence, not a gate. It can be expensive under load.
          get_optional before "${BASE_URL}/api/maintenance/diagnostics/conversion?hours=24&limit=100" 180
          get_optional recent-before "${BASE_URL}/api/families?trust=verified&posted_within=1&page=1&page_size=1" 90

          # Production evidence from run 30794497608: the first eight limit=4 drains all
          # completed, claimed 32 candidates, promoted 32 sources, and created four verified
          # jobs. Requests after that saturated Postgres. Exploit the proven window only,
          # then stop pressure and publish once.
          for i in $(seq 1 8); do
            post_json "drain-${i}" "${BASE_URL}/api/maintenance/diagnostics/drain-candidates?limit=4&concurrency=4&hours=24&timeout_seconds=42" 52
            sleep 4
          done

          post_json repair-final "${BASE_URL}/api/maintenance/diagnostics/repair-publication?limit=300&hours=24" 65
          sleep 12

          get_optional after "${BASE_URL}/api/maintenance/diagnostics/conversion?hours=24&limit=100" 180
          get_optional recent-after "${BASE_URL}/api/families?trust=verified&posted_within=1&page=1&page_size=1" 90

          before=$(jq -r '.funnel.new_verified_jobs_window // empty' evidence/before.json 2>/dev/null || true)
          after=$(jq -r '.funnel.new_verified_jobs_window // empty' evidence/after.json 2>/dev/null || true)
          active_before=$(jq -r '.funnel.active_verified_jobs // empty' evidence/before.json 2>/dev/null || true)
          active_after=$(jq -r '.funnel.active_verified_jobs // empty' evidence/after.json 2>/dev/null || true)
          openings_before=$(jq -r '.funnel.active_verified_openings // empty' evidence/before.json 2>/dev/null || true)
          openings_after=$(jq -r '.funnel.active_verified_openings // empty' evidence/after.json 2>/dev/null || true)
          recent_before=$(jq -r '.total // empty' evidence/recent-before.json 2>/dev/null || true)
          recent_after=$(jq -r '.total // empty' evidence/recent-after.json 2>/dev/null || true)

          claimed=$(jq -s '[.[] | .claimed_candidates // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          promoted=$(jq -s '[.[] | .promoted_sources // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          drain_delta=$(jq -s '[.[] | .verified_jobs_delta // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          recovered_employers=$(jq -s '[.[] | .recovered_employers[]?] | unique' evidence/drain-*.json 2>/dev/null || echo '[]')
          successful_drains=$(awk '$1==200{n++} END{print n+0}' evidence/drain-*.status)

          delta=0; active_delta=0; opening_delta=0; recent_delta=0
          if [[ "$before" =~ ^[0-9]+$ && "$after" =~ ^[0-9]+$ ]]; then delta=$((after-before)); fi
          if [[ "$active_before" =~ ^[0-9]+$ && "$active_after" =~ ^[0-9]+$ ]]; then active_delta=$((active_after-active_before)); fi
          if [[ "$openings_before" =~ ^[0-9]+$ && "$openings_after" =~ ^[0-9]+$ ]]; then opening_delta=$((openings_after-openings_before)); fi
          if [[ "$recent_before" =~ ^[0-9]+$ && "$recent_after" =~ ^[0-9]+$ ]]; then recent_delta=$((recent_after-recent_before)); fi

          # Per-drain counters are database-backed before/after snapshots and remain valid
          # even when the final broad diagnostic times out.
          measured_delta=$drain_delta
          if [ "$delta" -gt "$measured_delta" ]; then measured_delta=$delta; fi
          if [ "$active_delta" -gt "$measured_delta" ]; then measured_delta=$active_delta; fi
          if [ "$recent_delta" -gt "$measured_delta" ]; then measured_delta=$recent_delta; fi

          if [ "$measured_delta" -gt 0 ]; then state=success; else state=failure; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=verified +${measured_delta}; drains ${successful_drains}/8; claimed ${claimed}; promoted ${promoted}" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified job conversion funnel"
            echo "- Verified delta: +${measured_delta}"
            echo "- Per-drain verified delta: +${drain_delta}"
            echo "- Verified 24h window: ${before:-unavailable} -> ${after:-unavailable} (${delta})"
            echo "- Active verified jobs: ${active_before:-unavailable} -> ${active_after:-unavailable} (${active_delta})"
            echo "- Active verified openings: ${openings_before:-unavailable} -> ${openings_after:-unavailable} (${opening_delta})"
            echo "- Public recent verified: ${recent_before:-unavailable} -> ${recent_after:-unavailable} (${recent_delta})"
            echo "- Successful drains: ${successful_drains}/8"
            echo "- Candidates claimed: ${claimed}"
            echo "- Sources promoted: ${promoted}"
            echo "- Recovered employers: ${recovered_employers}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$state" = success

      - name: Publish funnel status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.funnel.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.funnel.outputs.description || 'Conversion funnel did not complete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-conversion" \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"

      - name: Upload conversion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-conversion-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
