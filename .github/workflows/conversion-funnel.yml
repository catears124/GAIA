name: Verified job conversion funnel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/conversion-funnel.yml"
      - "src/gaia/conversion_funnel.py"
      - "src/gaia/conversion_diagnostics_api.py"
      - "src/gaia/fast_candidate_drain.py"
      - "src/gaia/lead_promotion.py"
      - "src/gaia/fresh_lead_retry.py"
      - "src/gaia/db.py"
      - "src/gaia/db_write.py"
      - "src/gaia/page_verification.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/schema.sql"
      - "app.py"
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-conversion-funnel-v8-full-candidate-drain
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Capture baseline, drain due ATS sources, repair publication, and verify
        id: funnel
        env:
          BASE_URL: https://gaiajob.vercel.app
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"
          get_report() {
            curl --fail --silent --show-error --location --user-agent "$ua" \
              --connect-timeout 15 --max-time 180 --retry 2 --retry-all-errors --retry-delay 3 "$1"
          }
          recent_verified() {
            curl --fail --silent --show-error --location --user-agent "$ua" \
              --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 \
              "${BASE_URL}/api/families?trust=verified&posted_within=1&page=1&page_size=100"
          }
          post_json() {
            local name="$1" url="$2" max_time="${3:-50}"
            local code
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time "$max_time" \
              --output "evidence/${name}.json" --write-out '%{http_code}' "$url" || printf '000')
            printf '%s\n' "$code" > "evidence/${name}.status"
          }
          repair() {
            local name="$1"
            post_json "$name" "${BASE_URL}/api/maintenance/diagnostics/repair-publication?limit=300&hours=24" 50
          }

          get_report "${BASE_URL}/api/maintenance/diagnostics/conversion?hours=24&limit=100" > evidence/before.json
          recent_verified > evidence/recent-before.json
          before=$(jq -r '.funnel.new_verified_jobs_window // 0' evidence/before.json)
          active_before=$(jq -r '.funnel.active_verified_jobs // 0' evidence/before.json)
          openings_before=$(jq -r '.funnel.active_verified_openings // 0' evidence/before.json)
          recent_before=$(jq -r '.total // 0' evidence/recent-before.json)

          repair repair-initial

          # Consume the requested 64 due candidates in bounded four-source transactions.
          # Each successful probe persists the official board result immediately; regular
          # publication repairs prevent newly verified postings from waiting for reconcile.
          for i in $(seq 1 16); do
            post_json "drain-${i}" "${BASE_URL}/api/maintenance/diagnostics/drain-candidates?limit=4&concurrency=4&hours=24&timeout_seconds=42" 48
            if [ $((i % 4)) -eq 0 ]; then repair "drain-repair-$((i / 4))"; fi
          done

          # Retry only after source ingestion so fresh employer pages discovered by those
          # boards are available to the verifier rather than repeatedly polling an empty queue.
          for i in $(seq 1 4); do
            post_json "retry-${i}" "${BASE_URL}/api/maintenance/diagnostics/retry-fresh-leads?limit=16&concurrency=8&hours=24&retry_after_minutes=10&timeout_seconds=45" 50
          done
          for i in $(seq 1 4); do
            post_json "promote-${i}" "${BASE_URL}/api/maintenance/diagnostics/promote-leads?limit=16&concurrency=8&hours=24&max_age_days=14&timeout_seconds=45" 50
          done

          repair repair-final
          sleep 10

          get_report "${BASE_URL}/api/maintenance/diagnostics/conversion?hours=24&limit=100" > evidence/after.json
          recent_verified > evidence/recent-after.json
          after=$(jq -r '.funnel.new_verified_jobs_window // 0' evidence/after.json)
          active_after=$(jq -r '.funnel.active_verified_jobs // 0' evidence/after.json)
          openings_after=$(jq -r '.funnel.active_verified_openings // 0' evidence/after.json)
          recent_after=$(jq -r '.total // 0' evidence/recent-after.json)
          delta=$((after-before)); active_delta=$((active_after-active_before))
          opening_delta=$((openings_after-openings_before)); recent_delta=$((recent_after-recent_before))
          discovered=$(jq -r '.funnel.discovered_postings_window // 0' evidence/after.json)
          due=$(jq -r '.sources.candidate_sources_due // 0' evidence/after.json)
          gaps=$(jq -r '.funnel.verified_postings_missing_family // 0' evidence/after.json)
          selected=$(jq -s '[.[] | .selected_leads // 0] | add // 0' evidence/retry-*.json evidence/promote-*.json 2>/dev/null || echo 0)
          recovered=$(jq -s '[.[] | .recovered_verified_openings // 0] | add // 0' evidence/retry-*.json evidence/promote-*.json 2>/dev/null || echo 0)
          verified_leads=$(jq -s '[.[] | .verified_leads // 0] | add // 0' evidence/retry-*.json evidence/promote-*.json 2>/dev/null || echo 0)
          claimed=$(jq -s '[.[] | .claimed_candidates // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          promoted=$(jq -s '[.[] | .promoted_sources // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          drain_delta=$(jq -s '[.[] | .verified_jobs_delta // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)

          if [ "$delta" -gt 0 ] || [ "$recent_delta" -gt 0 ] || [ "$active_delta" -gt 0 ]; then state=success; else state=failure; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=recent ${recent_before}->${recent_after} (${recent_delta}); active ${active_before}->${active_after} (${active_delta}); window ${before}->${after} (${delta})" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified job conversion funnel"
            echo "- Verified recent filter: ${recent_before} -> ${recent_after} (${recent_delta})"
            echo "- Verified 24h window: ${before} -> ${after} (${delta})"
            echo "- Active verified jobs: ${active_before} -> ${active_after} (${active_delta})"
            echo "- Active verified openings: ${openings_before} -> ${openings_after} (${opening_delta})"
            echo "- Discovered postings: ${discovered}"
            echo "- Due source candidates: ${due}"
            echo "- Publication gaps: ${gaps}"
            echo "- Candidates claimed: ${claimed}"
            echo "- Sources promoted: ${promoted}"
            echo "- Per-drain verified delta sum: ${drain_delta}"
            echo "- Lead pages selected: ${selected}"
            echo "- Verified lead outcomes: ${verified_leads}"
            echo "- Verified openings recovered: ${recovered}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$state" = success

      - name: Publish funnel status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.funnel.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.funnel.outputs.description || 'Conversion funnel did not complete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-conversion" \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"

      - name: Upload conversion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-conversion-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
