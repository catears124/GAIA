name: Verified job conversion funnel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/conversion-funnel.yml"
      - "src/gaia/conversion_funnel.py"
      - "src/gaia/conversion_diagnostics_api.py"
      - "src/gaia/fast_candidate_drain.py"
      - "src/gaia/lead_promotion.py"
      - "src/gaia/fresh_lead_retry.py"
      - "src/gaia/db.py"
      - "src/gaia/db_write.py"
      - "src/gaia/page_verification.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/schema.sql"
      - "app.py"
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-conversion-funnel-v10-single-candidate
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Convert candidates and verify production
        id: funnel
        env:
          BASE_URL: https://gaiajob.vercel.app
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"

          request() {
            local method="$1" name="$2" url="$3" max_time="$4"
            local code
            code=$(curl --silent --show-error --location --request "$method" \
              --user-agent "$ua" --connect-timeout 8 --max-time "$max_time" \
              --output "evidence/${name}.json" --write-out '%{http_code}' "$url" 2>"evidence/${name}.stderr" || true)
            code="${code:-000}"
            printf '%s\n' "$code" > "evidence/${name}.status"
          }

          # Cheap public serving-table count establishes the baseline. Never block useful
          # conversion on the broad diagnostic report.
          request GET recent-before "${BASE_URL}/api/families?trust=verified&posted_within=1&page=1&page_size=1" 25

          # One candidate per invocation keeps every request below the serverless limit,
          # bounds cancellation cleanup, and prevents a failed provider from holding the
          # whole batch. Continue through failures instead of saturating one request.
          for i in $(seq 1 16); do
            request POST "drain-${i}" "${BASE_URL}/api/maintenance/diagnostics/drain-candidates?limit=1&concurrency=1&hours=24&timeout_seconds=18" 24
            sleep 3
          done

          # Publish once after all bounded probes. Failure is evidence, not a reason to
          # discard successful candidate persistence from earlier requests.
          request POST repair-final "${BASE_URL}/api/maintenance/diagnostics/repair-publication?limit=1&hours=24" 45
          sleep 8
          request GET recent-after "${BASE_URL}/api/families?trust=verified&posted_within=1&page=1&page_size=1" 25
          request GET diagnostic-after "${BASE_URL}/api/maintenance/diagnostics/conversion?hours=24&limit=20" 45

          number_or_zero() {
            local value="$1"
            if [[ "$value" =~ ^-?[0-9]+$ ]]; then printf '%s' "$value"; else printf '0'; fi
          }

          before=$(jq -r '.total // empty' evidence/recent-before.json 2>/dev/null || true)
          after=$(jq -r '.total // empty' evidence/recent-after.json 2>/dev/null || true)
          before=$(number_or_zero "$before")
          after=$(number_or_zero "$after")
          public_delta=$((after-before))

          claimed=$(jq -s '[.[] | select(type=="object") | (.claimed_candidates // 0)] | add // 0' evidence/drain-*.json 2>/dev/null || true)
          promoted=$(jq -s '[.[] | select(type=="object") | (.promoted_sources // 0)] | add // 0' evidence/drain-*.json 2>/dev/null || true)
          claimed=$(number_or_zero "$claimed")
          promoted=$(number_or_zero "$promoted")
          successful_drains=$(awk '$1==200{n++} END{print n+0}' evidence/drain-*.status 2>/dev/null)
          successful_drains=$(number_or_zero "$successful_drains")

          diagnostic_new=$(jq -r '.funnel.new_verified_jobs_window // empty' evidence/diagnostic-after.json 2>/dev/null || true)
          diagnostic_active=$(jq -r '.funnel.active_verified_jobs // empty' evidence/diagnostic-after.json 2>/dev/null || true)
          diagnostic_new=$(number_or_zero "$diagnostic_new")
          diagnostic_active=$(number_or_zero "$diagnostic_active")

          measured_delta=$public_delta
          if [ "$measured_delta" -gt 0 ]; then state=success; else state=failure; fi
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf 'description=verified %+d; drains %d/16; claimed %d; promoted %d\n' \
            "$measured_delta" "$successful_drains" "$claimed" "$promoted" >> "$GITHUB_OUTPUT"

          {
            echo "### Verified job conversion funnel"
            echo "- Public recent verified: ${before} -> ${after} (${public_delta})"
            echo "- Diagnostic new verified jobs: ${diagnostic_new}"
            echo "- Diagnostic active verified jobs: ${diagnostic_active}"
            echo "- Successful drains: ${successful_drains}/16"
            echo "- Candidates claimed: ${claimed}"
            echo "- Sources promoted: ${promoted}"
            echo "- Publication repair HTTP: $(cat evidence/repair-final.status 2>/dev/null || echo unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$state" = success

      - name: Publish funnel status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.funnel.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.funnel.outputs.description || 'Conversion funnel did not complete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-conversion" \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"

      - name: Upload conversion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-conversion-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
