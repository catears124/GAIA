name: Production schedule repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schedule-repair.yml"
      - "src/gaia/repair_schedule.py"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: gaia-production-schedule-repair
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require direct Supabase connection
        shell: bash
        run: test -n "$GAIA_DATABASE_URL"
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Requeue stale empty current sources
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m gaia.repair_schedule; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
