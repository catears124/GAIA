name: Platform sitemap ATS census

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-sitemap-census.yml"
      - "src/gaia/platform_sitemap_census.py"
      - "tests/test_platform_sitemap_census.py"
  schedule:
    # Six cheap public-feed requests. Re-running frequently also makes the
    # census self-replaying after a temporary production database outage.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-platform-sitemap-census
  cancel-in-progress: true

jobs:
  census:
    name: Enumerate platform sitemap tenants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING || secrets.POSTGRES_URL || secrets.POSTGRES_PRISMA_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "45"
      GAIA_SITEMAP_CENSUS_HTTP_TIMEOUT: "45"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GAIA and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify sitemap census lane
        run: |
          set -euo pipefail
          ruff check src/gaia/platform_sitemap_census.py tests/test_platform_sitemap_census.py
          pytest -q tests/test_platform_sitemap_census.py

      - name: Enumerate complete public tenant feeds
        id: discover
        run: |
          set -euo pipefail
          python -m gaia.platform_sitemap_census \
            --snapshot-output platform-sitemap-census.json \
            | tee platform-sitemap-summary.json
          description=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("platform-sitemap-summary.json").read_text())
          print(
              f"Sitemap census: {data.get('candidate_sources', 0)} candidates; "
              f"providers={data.get('providers', 0)}; errors={data.get('request_errors', 0)}"
          )
          PY
          )
          echo "description=${description:0:140}" >> "$GITHUB_OUTPUT"

      - name: Wait for production database recovery
        run: |
          set -euo pipefail
          test -n "$GAIA_DATABASE_URL"
          # A successful census is valuable even during a Supabase failover. Keep
          # this runner attached long enough to capture the snapshot as soon as the
          # pooler starts accepting connections again; the 15-minute schedule is the
          # outer retry if recovery takes longer.
          python -m gaia.wait_for_database --timeout-seconds 480

      - name: Feed source candidate queue
        id: capture
        run: |
          set -euo pipefail
          python -m gaia.platform_sitemap_census \
            --snapshot-input platform-sitemap-census.json \
            --capture-only \
            --batch-size 500 \
            | tee platform-sitemap-capture.json

      - name: Upload sitemap census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-sitemap-census-${{ github.run_id }}
          path: |
            platform-sitemap-census.json
            platform-sitemap-summary.json
            platform-sitemap-capture.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish census status
        if: always()
        env:
          DESCRIPTION: ${{ steps.discover.outputs.description || 'Platform sitemap census failed' }}
        run: |
          if [ "${{ steps.capture.outcome }}" = success ]; then state=success; else state=failure; fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context gaia/platform-sitemap-census \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
