name: Severe inventory recovery

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/severe-recovery.yml"
      - ".github/workflows/source-audit.yml"
      - "src/gaia/health.py"
      - "src/gaia/source_audit.py"

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: gaia-severe-inventory-recovery
  cancel-in-progress: false

jobs:
  escalate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require production database
        run: test -n "$GAIA_DATABASE_URL"
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Read production inventory state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          gaia check --output severe-health.json || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("severe-health.json")
          severe = True
          reason = "health report missing"
          if path.is_file():
              report = json.loads(path.read_text())
              inventory = report.get("inventory", {})
              snapshots = report.get("snapshots", {})
              total = int(inventory.get("total", 0) or 0)
              fresh = int(inventory.get("fresh", 0) or 0)
              unhealthy = int(inventory.get("unhealthy", 0) or 0)
              recent = int(snapshots.get("recent_30m", 0) or 0)
              age = float(report.get("activity_age_minutes") or 9999)
              severe = unhealthy >= 100 or (unhealthy >= 25 and recent == 0) or age >= 60
              reason = f"fresh={fresh}/{total}, unhealthy={unhealthy}, snapshots_30m={recent}, age={age:.1f}m"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"severe={'true' if severe else 'false'}\n")
              output.write(f"reason={reason}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Inventory assessment: {reason}\n")
          PY
      - name: Launch source-by-source recovery when severe
        if: steps.state.outputs.severe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --workflow source-audit.yml --limit 30 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          if [ "$active" -eq 0 ]; then
            gh workflow run source-audit.yml --ref main
            for attempt in 1 2 3 4 5; do
              sleep 3
              active=$(gh run list --workflow source-audit.yml --limit 30 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
              if [ "$active" -gt 0 ]; then
                echo "Severe regression detected; source-by-source audit dispatched and verified." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
            echo "Source audit dispatch was not observable." >&2
            exit 1
          fi
          echo "Severe regression detected; source-by-source audit already active." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish severe recovery status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description="No severe inventory regression"
          if [ "${{ steps.state.outputs.severe }}" = true ]; then
            state=pending
            description="Severe regression: individual recovery active"
          fi
          payload=$(jq -n --arg state "$state" --arg context gaia/severe-recovery --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: severe-health-${{ github.run_id }}
          path: severe-health.json
          if-no-files-found: warn
          retention-days: 7
