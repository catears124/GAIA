name: Production reconcile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile.yml"
      - "src/gaia/wait_for_database.py"
      - "src/gaia/cli.py"
      - "src/gaia/db.py"
      - "src/gaia/db_write.py"
      - "src/gaia/universe.py"
      - "src/gaia/employer_census.py"
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-production-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    name: Rebuild public role feed and employer universe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "900"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending read-model status
        shell: bash
        run: |
          payload=$(jq -n --arg state pending --arg context gaia/production-read-model --arg description "Checking database readiness before reconciliation" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate database configuration
        id: config
        shell: bash
        run: |
          if [ -z "$GAIA_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Missing GitHub Actions secret POSTGRES_URL." >&2
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install GAIA
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check -e .
      - name: Classify production database readiness
        id: gate
        shell: bash
        run: |
          if [ "${{ steps.config.outputs.configured }}" != true ]; then
            echo "state=invalid" >> "$GITHUB_OUTPUT"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python -m gaia.wait_for_database --timeout-seconds 600
          code=$?
          set -e
          case "$code" in
            0) state=ready ;;
            1) state=recovering ;;
            2) state=invalid ;;
            *) state=failed ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Database readiness classified as $state (exit $code)."
      - name: Rebuild critical public role feed and employer universe
        if: steps.gate.outputs.state == 'ready'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gaia reconcile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            python -m gaia.wait_for_database --timeout-seconds 300
          done
      - name: Verify employer coverage read model
        if: steps.gate.outputs.state == 'ready'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee reconcile-universe.json
          import json
          from gaia.db import Database
          from gaia.universe import universe_summary

          report = universe_summary(Database(migrate=False), limit=1)
          summary = dict(report.get("summary") or {})
          payload = {
              "ready": bool(report.get("ready")),
              "rebuild_required": bool(report.get("rebuild_required")),
              "reason": report.get("reason"),
              "known_employers": int(summary.get("known_employers") or 0),
              "enumerated_employers": int(summary.get("enumerated_employers") or 0),
              "unresolved_employers": int(summary.get("unresolved_employers") or 0),
              "evidence_employers": int(summary.get("evidence_employers") or 0),
              "coverage_gap_employers": int(summary.get("coverage_gap_employers") or 0),
          }
          print(json.dumps(payload, sort_keys=True))
          if not payload["ready"]:
              raise SystemExit("employer universe is not ready")
          if payload["known_employers"] <= 0:
              raise SystemExit("employer universe contains no employers")
          if payload["enumerated_employers"] <= 0:
              raise SystemExit("employer universe contains no independently enumerated employers")
          if payload["rebuild_required"] or payload["coverage_gap_employers"]:
              raise SystemExit("employer universe is missing known evidence-backed employers")
          PY
      - name: Upload reconcile coverage evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-reconcile-universe-${{ github.run_id }}
          path: reconcile-universe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish read-model status
        if: always()
        shell: bash
        run: |
          gate="${{ steps.gate.outputs.state }}"
          if [ "$gate" = invalid ]; then
            state=failure
            description="Production read-model database configuration or credentials are invalid"
          elif [ "$gate" = recovering ]; then
            state=pending
            description="Database recovery active; reconciliation suppressed"
          elif [ "$gate" = failed ]; then
            state=failure
            description="Read-model database readiness probe failed unexpectedly"
          elif [ "$gate" != ready ]; then
            state=failure
            description="Read-model database readiness gate did not complete"
          else
            case "${{ job.status }}" in
              success)
                state=success
                description="Public role feed and employer universe are current"
                ;;
              cancelled)
                state=pending
                description="Reconciliation superseded by a newer pulse"
                ;;
              *)
                state=failure
                description="Public read-model reconciliation failed after recovery retries"
                ;;
            esac
          fi
          payload=$(jq -n --arg state "$state" --arg context gaia/production-read-model --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
