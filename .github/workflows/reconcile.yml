name: Production reconcile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile.yml"
      - "src/gaia/cli.py"
      - "src/gaia/db.py"
      - "src/gaia/db_write.py"
      - "src/gaia/universe.py"
      - "src/gaia/employer_census.py"
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-production-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    name: Rebuild public role feed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "900"
      GAIA_RECONCILE_EMPLOYER_UNIVERSE: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending read-model status
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state "pending" \
            --arg context "gaia/production-read-model" \
            --arg description "Public role-feed reconciliation is running" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase connection
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL." >&2
            exit 1
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Rebuild critical public role feed
        run: gaia reconcile
      - name: Publish read-model status
        if: always()
        shell: bash
        run: |
          case "${{ job.status }}" in
            success)
              state=success
              description="Public role feed is current"
              ;;
            cancelled)
              state=pending
              description="Reconciliation superseded by a newer pulse"
              ;;
            *)
              state=failure
              description="Public role-feed reconciliation failed"
              ;;
          esac
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/production-read-model" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
