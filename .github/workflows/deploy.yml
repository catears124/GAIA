name: Verify Vercel application

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GAIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_INITIAL_SYNC: "0"
      GAIA_READ_ONLY: "1"
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres dropdb --if-exists gaia_test
          sudo -u postgres createdb gaia_test
          for attempt in {1..15}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready." >&2
          exit 1
      - run: python -m pip install -e ".[dev]"
      - run: gaia migrate
      - run: ruff check .
      - run: pytest -q
      - name: Smoke-test Vercel entrypoint
        env:
          VERCEL: "1"
        run: python -c "from app import app; assert app.title == 'GAIA'"

# Production deployment is handled by Vercel's GitHub integration. No Vercel token,
# organization ID, or project ID is required in GitHub Actions.
