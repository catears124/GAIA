name: Verify Vercel application

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GAIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_INITIAL_SYNC: "0"
      GAIA_READ_ONLY: "1"
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: gaia migrate
      - run: ruff check .
      - run: pytest -q
      - name: Smoke-test Vercel entrypoint
        env:
          VERCEL: "1"
        run: python -c "from app import app; assert app.title == 'GAIA'"

# Production deployment is handled by Vercel's GitHub integration. No Vercel token,
# organization ID, or project ID is required in GitHub Actions.
