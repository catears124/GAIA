name: Production source diagnostics

on:
  push:
    branches: [main]
    paths:
      - src/gaia/production_coverage.py
      - src/gaia/product_api.py
      - src/gaia/api.py
      - .github/workflows/production-coverage-diagnostics.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-coverage-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install diagnostics
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Allow deployment to settle
        if: github.event_name == 'push'
        run: sleep 45

      - name: Fetch live health and source coverage
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          fetch() {
            local name="$1" path="$2"
            if ! curl --silent --show-error --location \
              --connect-timeout 5 --max-time 30 \
              --dump-header "diagnostics/${name}.headers" \
              --output "diagnostics/${name}.json" \
              --write-out '%{http_code}' \
              "https://gaiajob.vercel.app${path}" > "diagnostics/${name}.status"; then
              printf '000\n' > "diagnostics/${name}.status"
              printf '{}\n' > "diagnostics/${name}.json"
            fi
          }
          fetch health /api/health &
          fetch coverage /api/coverage &
          wait

      - name: Evaluate source diagnostics
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          health_status=$(tr -d '\r\n' < diagnostics/health.status)
          coverage_status=$(tr -d '\r\n' < diagnostics/coverage.status)
          if [ "$health_status" != 200 ] || [ "$coverage_status" != 200 ]; then
            printf '%s\n' '{"state":"failure","description":"Production health or coverage endpoint unavailable","total":0,"fresh":0,"unhealthy":0,"attention":[]}' > diagnostics/result.json
          else
            python -m gaia.production_coverage \
              diagnostics/health.json diagnostics/coverage.json \
              --output diagnostics/result.json
          fi
          state=$(jq -r '.state' diagnostics/result.json)
          description=$(jq -r '.description' diagnostics/result.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"
          {
            echo "### Production source diagnostics"
            echo "- Result: ${state}"
            echo "- Detail: ${description}"
            echo "- Health HTTP: ${health_status}"
            echo "- Coverage HTTP: ${coverage_status}"
            count=$(jq '.attention | length' diagnostics/result.json)
            echo "- Sources requiring attention: ${count}"
            jq -r '.attention[]? | "  - \(.source): \(.reason) (status=\(.status // "unknown"), last_complete=\(.last_complete_at // "never"))"' diagnostics/result.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish source diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.evaluate.outputs.state }}
          DESCRIPTION: ${{ steps.evaluate.outputs.description }}
        shell: bash
        run: |
          state="${STATE:-failure}"
          description="${DESCRIPTION:-Production source diagnostics did not complete}"
          payload=$(jq -n \
            --arg state "$state" \
            --arg context gaia/source-diagnostics \
            --arg description "${description:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Upload source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-source-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Fail invalid diagnostic contracts
        if: always()
        run: test "$(jq -r '.state' diagnostics/result.json 2>/dev/null || echo failure)" != failure
