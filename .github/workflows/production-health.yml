name: Production health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health.yml"
      - "src/gaia/health.py"
      - "src/gaia/cli.py"
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

concurrency:
  group: gaia-production-health
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
      GAIA_CHECK_MAX_ACTIVITY_MINUTES: "90"
      GAIA_CHECK_MIN_SOURCES: "100"
      GAIA_CHECK_MIN_ACTIVE_LISTINGS: "25"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending commit status
        shell: bash
        run: |
          payload=$(jq -n --arg state pending --arg context gaia/production-health --arg description "Production health check is running" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require direct Supabase connection
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || exit 1
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - id: production_check
        name: Check hosted inventory
        continue-on-error: true
        run: gaia check --output production-health.json
      - name: Publish health report
        if: always()
        shell: bash
        run: |
          echo "### GAIA production health" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          test -f production-health.json && cat production-health.json >> "$GITHUB_STEP_SUMMARY" || echo '{"ok":false,"errors":["checker produced no report"]}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - id: recovery_gate
        name: Classify inventory state
        if: always()
        shell: bash
        run: |
          state=fatal
          reason="health checker produced no report"
          if [ -f production-health.json ]; then
            state=$(python -c 'import json; r=json.load(open("production-health.json")); i=r.get("inventory",{}); s=r.get("snapshots",{}); degraded=(int(i.get("unhealthy",0))>0 and int(i.get("running",0))==0 and (float(i.get("fresh_percent",0))<75 or int(s.get("recent_30m",0))==0)); print("recover" if r.get("ok") is not True or degraded else "healthy")')
            reason=$(python -c 'import json; r=json.load(open("production-health.json")); i=r.get("inventory",{}); s=r.get("snapshots",{}); print(f"fresh={i.get(chr(102)+chr(114)+chr(101)+chr(115)+chr(104),0)}/{i.get(chr(116)+chr(111)+chr(116)+chr(97)+chr(108),0)}, unhealthy={i.get(chr(117)+chr(110)+chr(104)+chr(101)+chr(97)+chr(108)+chr(116)+chr(104)+chr(121),0)}, running={i.get(chr(114)+chr(117)+chr(110)+chr(110)+chr(105)+chr(110)+chr(103),0)}, snapshots_30m={s.get(chr(114)+chr(101)+chr(99)+chr(101)+chr(110)+chr(116)+chr(95)+chr(51)+chr(48)+chr(109),0)}, age={r.get(chr(97)+chr(99)+chr(116)+chr(105)+chr(118)+chr(105)+chr(116)+chr(121)+chr(95)+chr(97)+chr(103)+chr(101)+chr(95)+chr(109)+chr(105)+chr(110)+chr(117)+chr(116)+chr(101)+chr(115))}m")')
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Inventory state: $state — $reason" >> "$GITHUB_STEP_SUMMARY"
      - id: recovery
        name: Ensure inventory pulse is active
        if: steps.recovery_gate.outputs.state != 'healthy'
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --workflow inventory.yml --limit 50 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          if [ "$active" -eq 0 ]; then
            gh workflow run inventory.yml --ref main -f budget_seconds=900
            sleep 5
            active=$(gh run list --workflow inventory.yml --limit 20 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
            test "$active" -gt 0
            echo "Dispatched and verified a recovery pulse." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "An inventory pulse is already active; duplicate recovery suppressed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload health report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-health-${{ github.run_id }}
          path: production-health.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish final commit status
        if: always()
        shell: bash
        run: |
          state=success
          description="Production inventory is advancing"
          if [ "${{ steps.recovery_gate.outputs.state }}" = recover ]; then description="Inventory degraded; recovery pulse active"; fi
          if [ "${{ steps.recovery_gate.outputs.state }}" = fatal ] || [ "${{ steps.recovery.outcome }}" = failure ]; then state=failure; description="Inventory recovery could not be verified"; fi
          payload=$(jq -n --arg state "$state" --arg context gaia/production-health --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - name: Fail only when recovery failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.recovery_gate.outputs.state }}" = fatal ] || [ "${{ steps.recovery.outcome }}" = failure ]; then exit 1; fi
