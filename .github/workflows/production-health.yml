name: Production health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health.yml"
      - ".github/workflows/inventory.yml"
      - "src/gaia/wait_for_database.py"
      - "src/gaia/health.py"
      - "src/gaia/provider_health.py"
      - "src/gaia/provider_health_summary.py"
      - "src/gaia/cli.py"
      - "src/gaia/inventory.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/live_inventory.py"
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

concurrency:
  group: gaia-production-health
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "240"
      GAIA_CHECK_MAX_ACTIVITY_MINUTES: "90"
      GAIA_CHECK_MIN_SOURCES: "100"
      GAIA_CHECK_MIN_ACTIVE_LISTINGS: "25"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending commit status
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg state pending --arg context gaia/production-health --arg description "Production health check is running" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase pooler connection
        shell: bash
        run: test -n "$GAIA_DATABASE_URL"
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - id: database
        name: Classify database availability
        shell: bash
        run: |
          set +e
          python -m gaia.wait_for_database \
            --timeout-seconds 600 \
            --max-delay-seconds 30 \
            --github-output "$GITHUB_OUTPUT" \
            --json-output database-readiness.json \
            >database-readiness.log 2>&1
          code=$?
          set -e
          cat database-readiness.log
          echo "Readiness exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload readiness evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-health-database-readiness-${{ github.run_id }}
          path: |
            database-readiness.log
            database-readiness.json
          if-no-files-found: warn
          retention-days: 7
      - id: production_check
        name: Check hosted inventory
        if: steps.database.outputs.state == 'ready'
        continue-on-error: true
        run: gaia check --output production-health.json
      - id: provider_check
        name: Check provider backlog
        if: steps.database.outputs.state == 'ready'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m gaia.provider_health > provider-health.json
          python -m gaia.provider_health_summary < provider-health.json > provider-health-summary.json
      - name: Publish health report
        if: always()
        shell: bash
        run: |
          echo "### GAIA production health" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          test -f production-health.json && cat production-health.json >> "$GITHUB_STEP_SUMMARY" || echo '{"ok":false,"errors":["database unavailable or checker produced no report"]}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Provider backlog summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          test -f provider-health-summary.json && cat provider-health-summary.json >> "$GITHUB_STEP_SUMMARY" || echo '{"ok":false,"error":"provider report unavailable"}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - id: recovery_gate
        name: Classify production state
        if: always()
        shell: bash
        env:
          DATABASE_STATE: ${{ steps.database.outputs.state }}
          DATABASE_REASON: ${{ steps.database.outputs.reason }}
          PRODUCTION_OUTCOME: ${{ steps.production_check.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider_check.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          database_state = os.environ.get("DATABASE_STATE", "")
          database_reason = os.environ.get("DATABASE_REASON", "")
          if database_state == "recovering":
              state = "database-recovering"
              reason = database_reason or "database recovery exceeded the bounded readiness window"
          elif database_state == "invalid":
              state = "database-invalid"
              reason = database_reason or "production database configuration is invalid"
          elif database_state == "failed":
              state = "database-failed"
              reason = database_reason or "database readiness probe failed internally"
          elif database_state != "ready":
              state = "database-missing"
              reason = "database readiness produced no valid state"
          elif os.environ.get("PRODUCTION_OUTCOME") != "success":
              state = "fatal"
              reason = "health checker failed"
          elif os.environ.get("PROVIDER_OUTCOME") != "success":
              state = "fatal"
              reason = "provider backlog checker failed"
          else:
              try:
                  report = json.loads(Path("production-health.json").read_text())
                  provider = json.loads(Path("provider-health-summary.json").read_text())
                  inventory = report.get("inventory", {})
                  snapshots = report.get("snapshots", {})
                  total = int(inventory.get("total", 0) or 0)
                  fresh = int(inventory.get("fresh", 0) or 0)
                  unhealthy = int(inventory.get("unhealthy", 0) or 0)
                  running = int(inventory.get("running", 0) or 0)
                  fresh_percent = float(inventory.get("fresh_percent", 0) or 0)
                  recent = int(snapshots.get("recent_30m", 0) or 0)
                  age = report.get("activity_age_minutes")
                  provider_unhealthy = int(provider.get("unhealthy", 0) or 0)
                  provider_due = int(provider.get("due", 0) or 0)
                  state = "recover" if report.get("ok") is not True or unhealthy > 0 or provider_unhealthy > 0 else "healthy"
                  reason = (
                      f"fresh={fresh}/{total} ({fresh_percent:.1f}%), "
                      f"unhealthy={unhealthy}, running={running}, "
                      f"provider_unhealthy={provider_unhealthy}, provider_due={provider_due}, "
                      f"snapshots_30m={recent}, age={age}m"
                  )
              except (OSError, ValueError, TypeError, json.JSONDecodeError) as error:
                  state = "fatal"
                  reason = f"health evidence is malformed: {error}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"state={state}\n")
              output.write(f"reason={reason.replace(chr(10), ' ')[:500]}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Production state: {state} — {reason}\n")
          PY
      - id: recovery
        name: Ensure inventory pulse is active
        if: steps.recovery_gate.outputs.state == 'recover'
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --workflow inventory.yml --limit 50 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          if [ "$active" -eq 0 ]; then
            gh workflow run inventory.yml --ref main -f budget_seconds=900
            for attempt in 1 2 3 4 5; do
              sleep 3
              active=$(gh run list --workflow inventory.yml --limit 50 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
              if [ "$active" -gt 0 ]; then
                echo "Dispatched and verified a recovery pulse." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
            echo "Recovery dispatch was accepted but no active run appeared." >&2
            exit 1
          fi
          echo "An inventory pulse is already active; duplicate recovery suppressed." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload health report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-health-${{ github.run_id }}
          path: |
            production-health.json
            provider-health.json
            provider-health-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish final commit status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description="Production inventory is fully current"
          case "${{ steps.recovery_gate.outputs.state }}" in
            recover)
              state=pending
              description="Inventory catch-up is active"
              ;;
            database-recovering)
              state=pending
              description="Database recovery is in progress"
              ;;
            database-invalid)
              state=failure
              description="Production database configuration is invalid"
              ;;
            database-failed)
              state=failure
              description="Database readiness probe failed internally"
              ;;
            database-missing|fatal|"")
              state=failure
              description="Production health could not be verified"
              ;;
          esac
          if [ "${{ steps.recovery.outcome }}" = failure ]; then
            state=failure
            description="Inventory recovery could not be verified"
          fi
          payload=$(jq -n --arg state "$state" --arg context gaia/production-health --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - name: Fail on invalid configuration or internal verification failure
        if: always()
        shell: bash
        run: |
          case "${{ steps.recovery_gate.outputs.state }}" in
            database-invalid|database-failed|database-missing|fatal|"") exit 1 ;;
          esac
          if [ "${{ steps.recovery.outcome }}" = failure ]; then
            exit 1
          fi
