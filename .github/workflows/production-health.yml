name: Production health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health.yml"
      - ".github/workflows/inventory.yml"
      - ".github/workflows/reconcile.yml"
      - "src/gaia/health.py"
      - "src/gaia/cli.py"
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

concurrency:
  group: gaia-production-health
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_CHECK_MAX_ACTIVITY_MINUTES: "90"
      GAIA_CHECK_MIN_SOURCES: "100"
      GAIA_CHECK_MIN_ACTIVE_LISTINGS: "25"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending commit status
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state "pending" \
            --arg context "gaia/production-health" \
            --arg description "Production health check is running" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Require Supabase connection
        shell: bash
        run: |
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing GitHub Actions secret POSTGRES_URL." >&2
            exit 1
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - id: production_check
        name: Check hosted inventory
        continue-on-error: true
        run: gaia check --output production-health.json
      - name: Publish health report
        if: always()
        shell: bash
        run: |
          echo "### GAIA production health" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -f production-health.json ]; then
            cat production-health.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"ok": false, "errors": ["checker produced no report"]}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Replace scheduled lanes with a recovery crawl when stale
        if: steps.production_check.outcome != 'success'
        shell: bash
        run: |
          active_recovery=$(gh run list \
            --workflow inventory.yml \
            --limit 30 \
            --json event,status \
            --jq '[.[] | select(.event == "workflow_dispatch") | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')

          if [ "$active_recovery" -eq 0 ]; then
            gh workflow run inventory.yml --ref main -f budget_seconds=3300
            echo "Dispatched a 55-minute recovery crawl. Manual recovery jobs replace any stale scheduled lane through job-level concurrency." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A manual recovery crawl is already active; it was left running." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload health report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-health-${{ github.run_id }}
          path: production-health.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish final commit status
        if: always()
        shell: bash
        run: |
          state=success
          description="Production inventory is advancing"
          if [ "${{ steps.production_check.outcome }}" != "success" ]; then
            state=failure
            description="Production inventory stale; continuous recovery requested"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/production-health" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
      - name: Require healthy production
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.production_check.outcome }}" != "success" ]; then
            echo "Production health checker failed; a continuous recovery run was requested when none was already active." >&2
            exit 1
          fi
