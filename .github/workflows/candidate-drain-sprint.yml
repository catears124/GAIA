name: Candidate verification drain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/candidate-drain-sprint.yml"
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      batches:
        description: "Number of bounded candidate batches"
        required: false
        default: "8"
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: candidate-verification-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://gaiajob.vercel.app
      BATCHES: ${{ inputs.batches || '8' }}
    steps:
      - name: Drain due source candidates into verified jobs
        id: drain
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"

          report() {
            local name="$1"
            curl --silent --show-error --location \
              --user-agent "$ua" \
              --connect-timeout 10 --max-time 60 \
              --retry 2 --retry-all-errors --retry-delay 2 \
              --output "evidence/${name}.json" \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/maintenance/diagnostics/conversion?hours=24&limit=100" \
              > "evidence/${name}.status" || {
                printf '000\n' > "evidence/${name}.status"
                printf '{}\n' > "evidence/${name}.json"
              }
          }

          report baseline
          baseline=$(jq -r '.funnel.new_verified_jobs_window // 0' evidence/baseline.json)
          baseline_due=$(jq -r '.sources.candidate_sources_due // 0' evidence/baseline.json)
          batches="$BATCHES"
          if ! [[ "$batches" =~ ^[0-9]+$ ]]; then batches=8; fi
          if [ "$batches" -lt 1 ]; then batches=1; fi
          if [ "$batches" -gt 12 ]; then batches=12; fi

          promoted_total=0
          claimed_total=0
          for batch in $(seq 1 "$batches"); do
            status=$(curl --silent --show-error --location \
              --request POST \
              --user-agent "$ua" \
              --connect-timeout 15 --max-time 85 \
              --output "evidence/drain-${batch}.json" \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/maintenance/diagnostics/drain-candidates?limit=12&concurrency=12&hours=24" \
              || printf '000')
            printf '%s\n' "$status" > "evidence/drain-${batch}.status"
            claimed=$(jq -r '.claimed_candidates // 0' "evidence/drain-${batch}.json" 2>/dev/null || echo 0)
            promoted=$(jq -r '.promoted_sources // 0' "evidence/drain-${batch}.json" 2>/dev/null || echo 0)
            delta=$(jq -r '.verified_jobs_delta // 0' "evidence/drain-${batch}.json" 2>/dev/null || echo 0)
            claimed_total=$((claimed_total + claimed))
            promoted_total=$((promoted_total + promoted))
            printf 'batch=%s http=%s claimed=%s promoted=%s verified_delta=%s\n' \
              "$batch" "$status" "$claimed" "$promoted" "$delta" \
              | tee "evidence/drain-${batch}.txt"
            sleep 3
          done

          report final
          final=$(jq -r '.funnel.new_verified_jobs_window // 0' evidence/final.json)
          final_due=$(jq -r '.sources.candidate_sources_due // 0' evidence/final.json)
          delta=$((final - baseline))
          due_delta=$((final_due - baseline_due))
          jq -n \
            --argjson baseline "$baseline" \
            --argjson final "$final" \
            --argjson delta "$delta" \
            --argjson baseline_due "$baseline_due" \
            --argjson final_due "$final_due" \
            --argjson due_delta "$due_delta" \
            --argjson claimed "$claimed_total" \
            --argjson promoted "$promoted_total" \
            '{baseline_verified:$baseline,final_verified:$final,verified_delta:$delta,baseline_due:$baseline_due,final_due:$final_due,due_delta:$due_delta,claimed_candidates:$claimed,promoted_sources:$promoted}' \
            > evidence/result.json

          if [ "$delta" -gt 0 ]; then
            state=success
            description="Verified jobs +${delta}; ${promoted_total} sources promoted; ${final_due} candidates due"
          else
            state=failure
            description="No verified-job gain; ${promoted_total} sources promoted; ${final_due} candidates due"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"
          {
            echo "### Candidate verification drain"
            echo "- Baseline verified jobs: ${baseline}"
            echo "- Final verified jobs: ${final}"
            echo "- Verified-job delta: ${delta}"
            echo "- Candidates claimed: ${claimed_total}"
            echo "- Sources promoted: ${promoted_total}"
            echo "- Due candidates: ${baseline_due} → ${final_due}"
            echo ""
            cat evidence/drain-*.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish drain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.drain.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.drain.outputs.description || 'Candidate drain did not complete' }}
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state "$STATE" \
            --arg context "gaia/candidate-drain" \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Upload drain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-drain-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Fail if verified jobs did not increase
        if: always()
        run: test "${{ steps.drain.outputs.state || 'failure' }}" = success
