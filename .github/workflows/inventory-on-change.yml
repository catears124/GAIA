name: Dispatch inventory after crawler changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory.yml"
      - ".github/workflows/inventory-on-change.yml"
      - "src/gaia/inventory.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/live_inventory.py"
      - "src/gaia/db_base.py"
      - "src/gaia/db_write.py"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start production inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run inventory.yml --repo "$GITHUB_REPOSITORY" --ref main -f budget_seconds=1200
