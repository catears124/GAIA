name: Publish static inventory snapshot

on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/static-snapshot.yml"
      - "src/gaia/static_snapshot.py"
      - "src/gaia/static_snapshot_http.py"
      - "src/gaia/snapshot_validation.py"
      - "src/gaia/restore_snapshot_artifact.py"
      - "src/gaia/wait_for_database.py"
      - "src/gaia/product_api.py"
      - "src/gaia/api.py"

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: gaia-static-inventory-snapshot
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_PUBLIC_BASE_URL: https://gaiajob.vercel.app
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "120"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish pending snapshot status
        shell: bash
        run: |
          payload=$(jq -n --arg state pending --arg context gaia/static-snapshot --arg description "Refreshing deployable inventory snapshot" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Restore latest durable snapshot artifact
        id: artifact_restore
        continue-on-error: true
        run: |
          python -m gaia.restore_snapshot_artifact --max-artifacts 50
          echo artifact-restored > snapshot-source.txt
      - name: Export through healthy public API
        id: api_export
        continue-on-error: true
        run: |
          python -m gaia.static_snapshot_http --timeout-seconds 20
          echo public-api > snapshot-source.txt
      - name: Classify database fallback readiness
        id: db_gate
        if: steps.api_export.outcome != 'success'
        shell: bash
        run: |
          set +e
          if [ -z "${GAIA_DATABASE_URL}" ]; then
            code=2
            state=invalid
            reason=missing_database_url
            printf '%s\n' "GAIA_DATABASE_URL is not configured" > database-readiness.log
            printf '%s\n' '{"state":"invalid","exit_code":2,"reason":"missing_database_url"}' > database-readiness.json
          else
            python -m gaia.wait_for_database --timeout-seconds 120 --json-output database-readiness.json > database-readiness.log 2>&1
            code=$?
            case "$code" in
              0) state=ready ;;
              1) state=recovering ;;
              2) state=invalid ;;
              *) state=failed ;;
            esac
            reason=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path("database-readiness.json").read_text())
              print(str(payload.get("reason") or "unknown"))
          except Exception:
              print("missing_readiness_evidence")
          PY
            )
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          cat database-readiness.log
          exit 0
      - name: Upload database readiness evidence
        if: always() && steps.db_gate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: gaia-static-snapshot-readiness-${{ github.run_id }}
          path: |
            database-readiness.log
            database-readiness.json
          retention-days: 14
          if-no-files-found: warn
      - name: Export directly from database fallback
        id: db_export
        if: steps.api_export.outcome != 'success' && steps.db_gate.outputs.state == 'ready'
        continue-on-error: true
        run: |
          python -m gaia.static_snapshot
          echo database > snapshot-source.txt
      - name: Validate generated or recovered snapshot
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from gaia.snapshot_validation import validate_snapshot_file

          report = validate_snapshot_file(
              Path("src/gaia/frontend/last-known-inventory.json"), max_age_hours=168
          )
          print(
              f"snapshot roles={report.roles} expected={report.expected_roles} "
              f"age_hours={report.age_hours:.2f} size_mb={report.size_mb:.2f}"
          )
          PY
          if [ ! -f snapshot-source.txt ]; then
            echo retained > snapshot-source.txt
          fi
          echo "source=$(cat snapshot-source.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload durable snapshot artifact
        if: steps.validate.outcome == 'success' && (steps.validate.outputs.source == 'public-api' || steps.validate.outputs.source == 'database')
        uses: actions/upload-artifact@v4
        with:
          name: gaia-inventory-snapshot-${{ github.run_id }}
          path: src/gaia/frontend/last-known-inventory.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit changed snapshot
        if: steps.validate.outputs.source == 'public-api' || steps.validate.outputs.source == 'database'
        shell: bash
        run: |
          set -euo pipefail
          path=src/gaia/frontend/last-known-inventory.json
          if git diff --quiet -- "$path"; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          git config user.name "gaia-inventory-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data: refresh deployable inventory snapshot"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Publish final snapshot status
        if: always()
        shell: bash
        run: |
          source="${{ steps.validate.outputs.source }}"
          db_state="${{ steps.db_gate.outputs.state }}"
          db_reason="${{ steps.db_gate.outputs.reason }}"
          if [ "$db_state" = invalid ]; then
            state=failure
            description="Snapshot fallback database configuration is invalid"
          elif [ "$db_state" = failed ]; then
            state=failure
            description="Snapshot database readiness probe failed internally"
          elif [ "${{ steps.validate.outcome }}" != success ]; then
            state=failure
            description="No usable deployable inventory snapshot exists"
          elif [ "$source" = retained ] || [ "$source" = artifact-restored ]; then
            state=pending
            if [ "$db_state" = recovering ]; then
              description="Database/API recovery active; recovered snapshot remains usable"
            else
              description="Recovered snapshot remains usable; refresh source unavailable"
            fi
          else
            state=success
            description="Deployable inventory snapshot refreshed via ${source}"
          fi
          echo "database_state=${db_state:-not-needed} database_reason=${db_reason:-none} source=${source:-none}"
          payload=$(jq -n --arg state "$state" --arg context gaia/static-snapshot --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
          if [ "$db_state" = invalid ] || [ "$db_state" = failed ]; then
            exit 1
          fi
