name: Publish static inventory snapshot

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_run:
    workflows: ["Production inventory"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/static-snapshot.yml"
      - "src/gaia/static_snapshot.py"
      - "src/gaia/static_snapshot_http.py"
      - "src/gaia/snapshot_validation.py"
      - "src/gaia/product_api.py"
      - "src/gaia/api.py"

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: gaia-static-inventory-snapshot
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING || secrets.POSTGRES_URL || secrets.POSTGRES_PRISMA_URL }}
      GAIA_PUBLIC_BASE_URL: https://gaiajob.vercel.app
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "25"
      GAIA_STATIC_SNAPSHOT_DB_ATTEMPTS: "4"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish pending snapshot status
        shell: bash
        run: |
          payload=$(jq -n --arg state pending --arg context gaia/static-snapshot --arg description "Refreshing public inventory snapshot" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .

      - name: Restore latest published snapshot
        id: published_restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/gaia/frontend
          git show origin/snapshot-data:src/gaia/frontend/last-known-inventory.json > src/gaia/frontend/last-known-inventory.json
          echo published-snapshot > snapshot-source.txt

      - name: Check database configuration
        id: db_gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GAIA_DATABASE_URL}" ]; then
            state=invalid
            reason=missing_database_url
            printf '%s\n' "GAIA_DATABASE_URL is not configured" > database-readiness.log
          else
            state=configured
            reason=exporter_owns_connection_retries
            printf '%s\n' "Database URL configured; snapshot exporter owns checkout retries." > database-readiness.log
          fi
          printf '{"state":"%s","reason":"%s"}\n' "$state" "$reason" > database-readiness.json
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          cat database-readiness.log

      - name: Upload database configuration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaia-static-snapshot-readiness-${{ github.run_id }}
          path: |
            database-readiness.log
            database-readiness.json
          retention-days: 14
          if-no-files-found: warn

      - name: Export directly from production database
        id: db_export
        if: steps.db_gate.outputs.state == 'configured'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 170s python -m gaia.static_snapshot
          echo database > snapshot-source.txt

      - name: Export through public API only as fallback
        id: api_export
        if: steps.db_export.outcome != 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s python -m gaia.static_snapshot_http --timeout-seconds 20
          echo public-api > snapshot-source.txt

      - name: Validate generated or recovered snapshot
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from gaia.snapshot_validation import validate_snapshot_file

          report = validate_snapshot_file(
              Path("src/gaia/frontend/last-known-inventory.json"), max_age_hours=2
          )
          print(
              f"snapshot roles={report.roles} expected={report.expected_roles} "
              f"age_hours={report.age_hours:.2f} size_mb={report.size_mb:.2f}"
          )
          PY
          if [ ! -f snapshot-source.txt ]; then
            echo retained > snapshot-source.txt
          fi
          echo "source=$(cat snapshot-source.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload durable snapshot artifact
        if: steps.validate.outcome == 'success' && (steps.validate.outputs.source == 'public-api' || steps.validate.outputs.source == 'database')
        uses: actions/upload-artifact@v4
        with:
          name: gaia-inventory-snapshot-${{ github.run_id }}
          path: src/gaia/frontend/last-known-inventory.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish snapshot to data-only branch
        if: steps.validate.outputs.source == 'public-api' || steps.validate.outputs.source == 'database'
        shell: bash
        run: |
          set -euo pipefail
          source_path="$GITHUB_WORKSPACE/src/gaia/frontend/last-known-inventory.json"
          cp "$source_path" /tmp/last-known-inventory.json
          git fetch origin snapshot-data
          rm -rf /tmp/gaia-snapshot-data
          git worktree add /tmp/gaia-snapshot-data origin/snapshot-data
          destination=/tmp/gaia-snapshot-data/src/gaia/frontend/last-known-inventory.json
          mkdir -p "$(dirname "$destination")"
          cp /tmp/last-known-inventory.json "$destination"
          cd /tmp/gaia-snapshot-data
          if git diff --quiet -- src/gaia/frontend/last-known-inventory.json; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          git config user.name "gaia-inventory-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/gaia/frontend/last-known-inventory.json
          git commit -m "data: refresh public inventory snapshot"
          for attempt in 1 2 3; do
            if git pull --rebase origin snapshot-data && git push origin HEAD:snapshot-data; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish final snapshot status
        if: always()
        shell: bash
        run: |
          source="${{ steps.validate.outputs.source }}"
          db_state="${{ steps.db_gate.outputs.state }}"
          db_reason="${{ steps.db_gate.outputs.reason }}"
          fail=0
          if [ "$db_state" = invalid ]; then
            state=failure
            description="Snapshot database configuration is invalid"
            fail=1
          elif [ "${{ steps.validate.outcome }}" != success ]; then
            state=failure
            description="Fresh inventory snapshot was not produced"
            fail=1
          elif [ "$source" = published-snapshot ] || [ "$source" = retained ]; then
            state=failure
            description="Snapshot refresh failed; serving the last published copy"
            fail=1
          else
            state=success
            description="Public inventory snapshot refreshed via ${source}"
          fi
          echo "database_state=${db_state:-unknown} database_reason=${db_reason:-none} source=${source:-none}"
          payload=$(jq -n --arg state "$state" --arg context gaia/static-snapshot --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
          exit "$fail"