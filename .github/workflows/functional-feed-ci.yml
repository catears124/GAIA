name: Functional feed CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/functional-feed-ci.yml"
      - "src/gaia/product_api.py"
      - "src/gaia/maintenance_api.py"
      - "src/gaia/dynamic_market_discovery.py"
      - "tests/test_product_stats_units.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/functional-feed-ci.yml"
      - "src/gaia/product_api.py"
      - "src/gaia/maintenance_api.py"
      - "src/gaia/dynamic_market_discovery.py"
      - "tests/test_product_stats_units.py"
      - "pyproject.toml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: functional-feed-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending feed status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state pending \
            --arg context gaia/functional-feed \
            --arg description "Verifying strict internship targeting, ordering, and source bridge" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint functional feed path
        run: |
          ruff check \
            src/gaia/product_api.py \
            src/gaia/maintenance_api.py \
            src/gaia/dynamic_market_discovery.py \
            tests/test_product_stats_units.py
      - name: Test feed units, strict targeting, and ordering
        run: pytest -q tests/test_product_stats_units.py
      - name: Publish final feed status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ job.status }}" = success ]; then
            state=success
            description="Strict internship feed and source bridge checks passed"
          else
            state=failure
            description="Functional feed verification failed"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context gaia/functional-feed \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
