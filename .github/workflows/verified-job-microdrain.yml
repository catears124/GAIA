name: Verified job microdrain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verified-job-microdrain.yml"
      - "src/gaia/fast_candidate_drain.py"
      - "src/gaia/fresh_lead_retry.py"
      - "src/gaia/lead_promotion.py"
      - "src/gaia/conversion_funnel.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-microdrain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Recover verified jobs through live production API
        id: run
        env:
          BASE_URL: https://gaiajob.vercel.app
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"

          get_json() {
            curl --fail --silent --show-error --location --user-agent "$ua" \
              --connect-timeout 12 --max-time "${2:-60}" --retry 2 --retry-all-errors --retry-delay 2 "$1"
          }
          post_json() {
            local name="$1" url="$2" max_time="${3:-48}"
            local code
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time "$max_time" --retry 1 --retry-all-errors --retry-delay 1 \
              --output "evidence/${name}.json" --write-out '%{http_code}' "$url" || printf '000')
            printf '%s\n' "$code" > "evidence/${name}.status"
          }
          snapshot() {
            local name="$1"
            get_json "${BASE_URL}/api/families?trust=verified&posted_within=1&page=1&page_size=1" 70 > "evidence/${name}.json" || echo '{"total":0,"measurement_failed":true}' > "evidence/${name}.json"
          }

          snapshot before
          before=$(jq -r '.total // 0' evidence/before.json)

          # Recover already-discovered employer application pages first.
          for i in $(seq 1 4); do
            post_json "retry-${i}" "${BASE_URL}/api/maintenance/diagnostics/retry-fresh-leads?limit=24&concurrency=6&hours=24&retry_after_minutes=5&timeout_seconds=42" 48
            post_json "promote-${i}" "${BASE_URL}/api/maintenance/diagnostics/promote-leads?limit=48&concurrency=8&hours=24&max_age_days=14&timeout_seconds=42" 48
          done
          post_json repair-initial "${BASE_URL}/api/maintenance/diagnostics/repair-publication?limit=400&hours=24" 50

          # Single-source requests are the only production path that previously produced
          # a positive verified delta under database pressure. Run bounded waves and publish
          # frequently so a slow/bad source cannot poison the entire batch.
          for i in $(seq 1 36); do
            post_json "drain-${i}" "${BASE_URL}/api/maintenance/diagnostics/drain-candidates?limit=1&concurrency=1&hours=24&timeout_seconds=38" 44
            if [ $((i % 4)) -eq 0 ]; then
              post_json "repair-$((i / 4))" "${BASE_URL}/api/maintenance/diagnostics/repair-publication?limit=250&hours=24" 45
            fi
          done

          post_json repair-final "${BASE_URL}/api/maintenance/diagnostics/repair-publication?limit=500&hours=24" 55
          sleep 8
          snapshot after
          after=$(jq -r '.total // 0' evidence/after.json)
          delta=$((after-before))
          claimed=$(jq -s '[.[] | .claimed_candidates // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          promoted=$(jq -s '[.[] | .promoted_sources // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          reported=$(jq -s '[.[] | .verified_jobs_delta // 0] | add // 0' evidence/drain-*.json evidence/retry-*.json evidence/promote-*.json 2>/dev/null || echo 0)
          recovered=$(jq -s '[.[] | .recovered_employers[]?] | unique' evidence/drain-*.json evidence/retry-*.json evidence/promote-*.json 2>/dev/null || echo '[]')
          jq -n --argjson before "$before" --argjson after "$after" --argjson delta "$delta" \
            --argjson claimed "$claimed" --argjson promoted "$promoted" --argjson reported "$reported" \
            --argjson recovered "$recovered" \
            '{starting_verified:$before,ending_verified:$after,verified_delta:$delta,claimed_candidates:$claimed,promoted_sources:$promoted,operation_reported_delta:$reported,recovered_employers:$recovered}' > evidence/result.json
          if [ "$delta" -gt 0 ] || [ "$reported" -gt 0 ]; then state=success; else state=failure; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=verified ${before}->${after} (${delta}); reported ${reported}; claimed ${claimed}; promoted ${promoted}" >> "$GITHUB_OUTPUT"
          cat evidence/result.json >> "$GITHUB_STEP_SUMMARY"
          test "$state" = success

      - name: Publish microdrain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.run.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.run.outputs.description || 'live production recovery incomplete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-microdrain" --arg description "${DESCRIPTION:0:140}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-microdrain-${{ github.run_id }}
          path: evidence/
          retention-days: 30
