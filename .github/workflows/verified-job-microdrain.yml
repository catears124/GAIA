name: Verified job microdrain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verified-job-microdrain.yml"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-microdrain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Drain bounded candidates and measure verified delta
        id: run
        shell: bash
        env:
          BASE_URL: https://gaiajob.vercel.app
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"
          get_stats() {
            for attempt in $(seq 1 8); do
              if curl -fsSL --user-agent "$ua" --connect-timeout 10 --max-time 75 \
                "$BASE_URL/api/stats"; then return 0; fi
              sleep $((attempt * 5))
            done
            return 1
          }
          baseline=$(get_stats)
          printf '%s\n' "$baseline" > evidence/baseline.json
          start=$(jq -r '.new_today // 0' evidence/baseline.json)
          start_open=$(jq -r '.active_listings // 0' evidence/baseline.json)

          # Single-candidate calls are the only path that has recently produced verified jobs.
          # Keep waves small and avoid a full maintenance tick after every candidate; those
          # ticks were saturating Postgres and causing all later calls to return 504.
          for i in $(seq 1 24); do
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time 48 --output "evidence/drain-${i}.json" --write-out '%{http_code}' \
              "$BASE_URL/api/maintenance/diagnostics/drain-candidates?limit=1&concurrency=1&hours=24&timeout_seconds=38" || printf 000)
            printf '%s\n' "$code" > "evidence/drain-${i}.status"
            if [ $((i % 6)) -eq 0 ]; then
              curl --silent --show-error --location --request POST --user-agent "$ua" \
                --connect-timeout 10 --max-time 55 --output "evidence/repair-${i}.json" \
                "$BASE_URL/api/maintenance/diagnostics/repair-publication?limit=120&hours=24" || true
              sleep 8
            else
              sleep 3
            fi
          done

          # One bounded maintenance pass publishes persisted crawl results without repeatedly
          # rebuilding the entire inventory during the drain wave.
          curl --silent --show-error --location --request POST --user-agent "$ua" \
            --connect-timeout 10 --max-time 70 --output evidence/final-tick.json \
            "$BASE_URL/api/maintenance/tick" || true
          sleep 15

          final=$(get_stats)
          printf '%s\n' "$final" > evidence/final.json
          finish=$(jq -r '.new_today // 0' evidence/final.json)
          finish_open=$(jq -r '.active_listings // 0' evidence/final.json)
          delta=$((finish-start))
          opening_delta=$((finish_open-start_open))
          claimed=$(jq -s '[.[] | .claimed_candidates // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          promoted=$(jq -s '[.[] | .promoted_sources // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          drain_delta=$(jq -s '[.[] | .verified_jobs_delta // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          jq -n --argjson start "$start" --argjson finish "$finish" --argjson delta "$delta" \
            --argjson start_open "$start_open" --argjson finish_open "$finish_open" --argjson opening_delta "$opening_delta" \
            --argjson claimed "$claimed" --argjson promoted "$promoted" --argjson drain_delta "$drain_delta" \
            '{starting_verified:$start,ending_verified:$finish,verified_delta:$delta,starting_openings:$start_open,ending_openings:$finish_open,opening_delta:$opening_delta,claimed_candidates:$claimed,promoted_sources:$promoted,per_drain_verified_delta:$drain_delta}' > evidence/result.json
          if [ "$delta" -gt 0 ]; then state=success; else state=failure; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=${start} to ${finish} verified (${delta}); openings ${start_open} to ${finish_open}" >> "$GITHUB_OUTPUT"
          cat evidence/result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish microdrain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.run.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.run.outputs.description || 'microdrain incomplete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-microdrain" --arg description "${DESCRIPTION:0:140}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-microdrain-${{ github.run_id }}
          path: evidence/
          retention-days: 30

      - name: Require positive verified delta
        if: always()
        run: test "${{ steps.run.outputs.state || 'failure' }}" = success
