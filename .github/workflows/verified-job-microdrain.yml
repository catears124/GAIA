name: Verified job microdrain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verified-job-microdrain.yml"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-microdrain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Drain bounded candidates and measure verified delta
        id: run
        shell: bash
        env:
          BASE_URL: https://gaiajob.vercel.app
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"

          # /api/stats currently performs several aggregate scans and can consume the
          # entire workflow before conversion begins. The drain endpoint already reports
          # database-backed before/after verified counts, so use those exact deltas as the
          # primary measurement and keep stats strictly best-effort.
          curl --silent --show-error --location --user-agent "$ua" \
            --connect-timeout 8 --max-time 18 --output evidence/baseline.json \
            "$BASE_URL/api/stats" || true

          for i in $(seq 1 16); do
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time 50 --output "evidence/drain-${i}.json" --write-out '%{http_code}' \
              "$BASE_URL/api/maintenance/diagnostics/drain-candidates?limit=1&concurrency=1&hours=24&timeout_seconds=42" || printf 000)
            printf '%s\n' "$code" > "evidence/drain-${i}.status"
            sleep 4
          done

          # Publish only after candidate work is complete. Rebuilding during every drain
          # wave caused lock contention and statement timeouts without increasing jobs.
          curl --silent --show-error --location --request POST --user-agent "$ua" \
            --connect-timeout 10 --max-time 65 --output evidence/repair.json \
            "$BASE_URL/api/maintenance/diagnostics/repair-publication?limit=200&hours=24" || true
          sleep 12
          curl --silent --show-error --location --user-agent "$ua" \
            --connect-timeout 8 --max-time 18 --output evidence/final.json \
            "$BASE_URL/api/stats" || true

          claimed=$(jq -s '[.[] | .claimed_candidates // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          promoted=$(jq -s '[.[] | .promoted_sources // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          drain_delta=$(jq -s '[.[] | .verified_jobs_delta // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          start=$(jq -r '.new_today // empty' evidence/baseline.json 2>/dev/null || true)
          finish=$(jq -r '.new_today // empty' evidence/final.json 2>/dev/null || true)
          stats_delta=null
          if [[ "$start" =~ ^[0-9]+$ && "$finish" =~ ^[0-9]+$ ]]; then
            stats_delta=$((finish-start))
          fi
          jq -n --argjson claimed "$claimed" --argjson promoted "$promoted" \
            --argjson drain_delta "$drain_delta" --arg start "$start" --arg finish "$finish" \
            --arg stats_delta "$stats_delta" \
            '{starting_verified:($start|tonumber? // null),ending_verified:($finish|tonumber? // null),stats_verified_delta:($stats_delta|tonumber? // null),claimed_candidates:$claimed,promoted_sources:$promoted,verified_delta:$drain_delta}' > evidence/result.json
          if [ "$drain_delta" -gt 0 ]; then state=success; else state=failure; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=${drain_delta} verified jobs from ${claimed} candidates; ${promoted} sources promoted" >> "$GITHUB_OUTPUT"
          cat evidence/result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish microdrain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.run.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.run.outputs.description || 'microdrain incomplete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-microdrain" --arg description "${DESCRIPTION:0:140}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-microdrain-${{ github.run_id }}
          path: evidence/
          retention-days: 30

      - name: Require positive verified delta
        if: always()
        run: test "${{ steps.run.outputs.state || 'failure' }}" = success
