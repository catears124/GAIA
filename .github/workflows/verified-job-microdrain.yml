name: Verified job microdrain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verified-job-microdrain.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-microdrain
  cancel-in-progress: true

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Recover verified jobs and measure exact delta
        id: run
        shell: bash
        env:
          BASE_URL: https://gaiajob.vercel.app
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"

          request() {
            local name="$1"; shift
            local code
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time 55 --output "evidence/${name}.json" \
              --write-out '%{http_code}' "$@" || true)
            printf '%s\n' "${code:-000}" > "evidence/${name}.status"
            test -s "evidence/${name}.json" || printf '{}\n' > "evidence/${name}.json"
          }

          curl --silent --show-error --location --user-agent "$ua" \
            --connect-timeout 8 --max-time 20 --output evidence/baseline.json \
            "$BASE_URL/api/stats" || printf '{}\n' > evidence/baseline.json

          # One high-value lead recovery wave first. Repeated overlapping waves were
          # saturating PostgreSQL and causing every endpoint to time out before useful work.
          request retry "$BASE_URL/api/maintenance/diagnostics/retry-fresh-leads?limit=16&concurrency=2&hours=24&retry_after_minutes=5&timeout_seconds=48"
          sleep 5
          request promote "$BASE_URL/api/maintenance/diagnostics/promote-leads?limit=24&concurrency=2&hours=24&max_age_days=14&timeout_seconds=48"
          sleep 5
          request drain "$BASE_URL/api/maintenance/diagnostics/drain-candidates?limit=2&concurrency=1&hours=24&timeout_seconds=48"
          sleep 5
          request repair "$BASE_URL/api/maintenance/diagnostics/repair-publication?limit=250&hours=24"

          sleep 10
          curl --silent --show-error --location --user-agent "$ua" \
            --connect-timeout 8 --max-time 20 --output evidence/final.json \
            "$BASE_URL/api/stats" || printf '{}\n' > evidence/final.json

          num() { jq -r "$1 // 0 | numbers" "$2" 2>/dev/null | head -1; }
          retry_delta=$(num '.verified_jobs_delta' evidence/retry.json); retry_delta=${retry_delta:-0}
          promote_delta=$(num '.verified_jobs_delta' evidence/promote.json); promote_delta=${promote_delta:-0}
          drain_delta=$(num '.verified_jobs_delta' evidence/drain.json); drain_delta=${drain_delta:-0}
          claimed=$(num '.claimed_candidates' evidence/drain.json); claimed=${claimed:-0}
          promoted_sources=$(num '.promoted_sources' evidence/drain.json); promoted_sources=${promoted_sources:-0}
          reset=$(num '.fresh_retry_reset' evidence/retry.json); reset=${reset:-0}
          recovered_employers=$(jq '[.recovered_employers[]?] | unique | length' evidence/retry.json 2>/dev/null || echo 0)
          exact_delta=$((retry_delta + promote_delta + drain_delta))

          start=$(jq -r '.new_today // empty' evidence/baseline.json 2>/dev/null || true)
          finish=$(jq -r '.new_today // empty' evidence/final.json 2>/dev/null || true)
          stats_delta=0
          stats_available=false
          if [[ "$start" =~ ^[0-9]+$ && "$finish" =~ ^[0-9]+$ ]]; then
            stats_delta=$((finish-start))
            stats_available=true
          fi
          measured_delta=$exact_delta
          if [ "$stats_available" = true ] && [ "$stats_delta" -gt "$measured_delta" ]; then
            measured_delta=$stats_delta
          fi

          jq -n \
            --argjson start "${start:-null}" --argjson finish "${finish:-null}" \
            --argjson stats_delta "$stats_delta" --argjson exact_delta "$exact_delta" \
            --argjson measured_delta "$measured_delta" --argjson retry_delta "$retry_delta" \
            --argjson promote_delta "$promote_delta" --argjson drain_delta "$drain_delta" \
            --argjson claimed "$claimed" --argjson promoted_sources "$promoted_sources" \
            --argjson reset "$reset" --argjson recovered_employers "$recovered_employers" \
            '{starting_verified:$start,ending_verified:$finish,stats_verified_delta:$stats_delta,exact_verified_delta:$exact_delta,verified_delta:$measured_delta,retry_verified_delta:$retry_delta,promotion_verified_delta:$promote_delta,candidate_verified_delta:$drain_delta,fresh_retry_reset:$reset,recovered_employers:$recovered_employers,claimed_candidates:$claimed,promoted_sources:$promoted_sources}' \
            > evidence/result.json

          if [ "$measured_delta" -gt 0 ]; then state=success; else state=failure; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=${measured_delta} verified jobs; ${recovered_employers} employers; ${claimed} candidates" >> "$GITHUB_OUTPUT"
          cat evidence/result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish microdrain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.run.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.run.outputs.description || 'microdrain incomplete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-microdrain" --arg description "${DESCRIPTION:0:140}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-microdrain-${{ github.run_id }}
          path: evidence/
          retention-days: 30

      - name: Require positive verified delta
        if: always()
        run: test "${{ steps.run.outputs.state || 'failure' }}" = success
