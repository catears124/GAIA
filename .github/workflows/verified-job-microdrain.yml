name: Verified job microdrain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verified-job-microdrain.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-microdrain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Recover verified jobs and measure exact delta
        id: run
        shell: bash
        env:
          BASE_URL: https://gaiajob.vercel.app
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"

          curl --silent --show-error --location --user-agent "$ua" \
            --connect-timeout 8 --max-time 18 --output evidence/baseline.json \
            "$BASE_URL/api/stats" || true

          # Recover already-discovered, target-classified employer links first. This path
          # has previously produced the largest verified-job gains and avoids wasting the
          # entire run on low-yield source candidates.
          for i in 1 2; do
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time 50 --output "evidence/retry-${i}.json" --write-out '%{http_code}' \
              "$BASE_URL/api/maintenance/diagnostics/retry-fresh-leads?limit=8&concurrency=4&hours=24&retry_after_minutes=5&timeout_seconds=42" || printf 000)
            printf '%s\n' "$code" > "evidence/retry-${i}.status"
            sleep 4
          done

          for i in 1 2; do
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time 50 --output "evidence/promote-${i}.json" --write-out '%{http_code}' \
              "$BASE_URL/api/maintenance/diagnostics/promote-leads?limit=12&concurrency=4&hours=24&max_age_days=14&timeout_seconds=42" || printf 000)
            printf '%s\n' "$code" > "evidence/promote-${i}.status"
            sleep 4
          done

          curl --silent --show-error --location --request POST --user-agent "$ua" \
            --connect-timeout 10 --max-time 65 --output evidence/repair-before-drain.json \
            "$BASE_URL/api/maintenance/diagnostics/repair-publication?limit=200&hours=24" || true

          # Then sample the best due ATS candidates. Bound the wave so one slow board
          # cannot consume the whole run and prevent publication of recovered leads.
          for i in $(seq 1 8); do
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time 50 --output "evidence/drain-${i}.json" --write-out '%{http_code}' \
              "$BASE_URL/api/maintenance/diagnostics/drain-candidates?limit=1&concurrency=1&hours=24&timeout_seconds=42" || printf 000)
            printf '%s\n' "$code" > "evidence/drain-${i}.status"
            sleep 4
          done

          curl --silent --show-error --location --request POST --user-agent "$ua" \
            --connect-timeout 10 --max-time 65 --output evidence/repair-final.json \
            "$BASE_URL/api/maintenance/diagnostics/repair-publication?limit=200&hours=24" || true
          sleep 12
          curl --silent --show-error --location --user-agent "$ua" \
            --connect-timeout 8 --max-time 18 --output evidence/final.json \
            "$BASE_URL/api/stats" || true

          claimed=$(jq -s '[.[] | .claimed_candidates // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          promoted_sources=$(jq -s '[.[] | .promoted_sources // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          drain_delta=$(jq -s '[.[] | .verified_jobs_delta // 0] | add // 0' evidence/drain-*.json 2>/dev/null || echo 0)
          retry_delta=$(jq -s '[.[] | .verified_jobs_delta // 0] | add // 0' evidence/retry-*.json 2>/dev/null || echo 0)
          promote_delta=$(jq -s '[.[] | .verified_jobs_delta // 0] | add // 0' evidence/promote-*.json 2>/dev/null || echo 0)
          reset=$(jq -s '[.[] | .fresh_retry_reset // 0] | add // 0' evidence/retry-*.json 2>/dev/null || echo 0)
          recovered_employers=$(jq -s '[.[] | .recovered_employers[]?] | unique | length' evidence/retry-*.json 2>/dev/null || echo 0)
          exact_delta=$((drain_delta + retry_delta + promote_delta))
          start=$(jq -r '.new_today // empty' evidence/baseline.json 2>/dev/null || true)
          finish=$(jq -r '.new_today // empty' evidence/final.json 2>/dev/null || true)
          stats_delta=null
          if [[ "$start" =~ ^[0-9]+$ && "$finish" =~ ^[0-9]+$ ]]; then
            stats_delta=$((finish-start))
          fi
          measured_delta=$exact_delta
          if [[ "$stats_delta" =~ ^-?[0-9]+$ && "$stats_delta" -gt "$measured_delta" ]]; then
            measured_delta=$stats_delta
          fi
          jq -n --argjson claimed "$claimed" --argjson promoted_sources "$promoted_sources" \
            --argjson drain_delta "$drain_delta" --argjson retry_delta "$retry_delta" \
            --argjson promote_delta "$promote_delta" --argjson exact_delta "$exact_delta" \
            --argjson measured_delta "$measured_delta" --argjson reset "$reset" \
            --argjson recovered_employers "$recovered_employers" --arg start "$start" \
            --arg finish "$finish" --arg stats_delta "$stats_delta" \
            '{starting_verified:($start|tonumber? // null),ending_verified:($finish|tonumber? // null),stats_verified_delta:($stats_delta|tonumber? // null),exact_verified_delta:$exact_delta,verified_delta:$measured_delta,retry_verified_delta:$retry_delta,promotion_verified_delta:$promote_delta,candidate_verified_delta:$drain_delta,fresh_retry_reset:$reset,recovered_employers:$recovered_employers,claimed_candidates:$claimed,promoted_sources:$promoted_sources}' > evidence/result.json
          if [ "$measured_delta" -gt 0 ]; then state=success; else state=failure; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=${measured_delta} verified jobs; ${recovered_employers} employers; ${claimed} candidates" >> "$GITHUB_OUTPUT"
          cat evidence/result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish microdrain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.run.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.run.outputs.description || 'microdrain incomplete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-microdrain" --arg description "${DESCRIPTION:0:140}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-microdrain-${{ github.run_id }}
          path: evidence/
          retention-days: 30

      - name: Require positive verified delta
        if: always()
        run: test "${{ steps.run.outputs.state || 'failure' }}" = success
