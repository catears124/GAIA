name: Verified job microdrain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verified-job-microdrain.yml"
      - "src/gaia/fast_candidate_drain.py"
      - "src/gaia/fresh_lead_retry.py"
      - "src/gaia/lead_promotion.py"
      - "src/gaia/conversion_funnel.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verified-job-microdrain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_MIGRATION_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DIAGNOSTIC_CANDIDATE_LEASE_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Recover verified jobs directly from production
        id: run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import asyncio
          import json
          from pathlib import Path

          from gaia.fast_candidate_drain import _verified_snapshot, drain_candidates
          from gaia.fresh_lead_retry import retry_fresh_leads
          from gaia.lead_promotion import promote_leads
          from gaia.live_inventory import LiveDatabase
          from gaia.conversion_funnel import repair_publication

          out = Path("evidence")
          db = LiveDatabase(migrate=False)

          def dump(name, value):
              (out / f"{name}.json").write_text(json.dumps(value, default=str, indent=2) + "\n")

          baseline = _verified_snapshot(db, hours=24)
          dump("baseline", baseline)

          results = []
          # Recover already-discovered, correctly classified employer links first.
          for wave in range(3):
              retry = asyncio.run(retry_fresh_leads(
                  limit=32, concurrency=6, hours=24, retry_after_minutes=5
              ))
              retry["operation"] = f"retry_fresh_leads_{wave+1}"
              results.append(retry)
              dump(f"retry-{wave+1}", retry)

              promote = asyncio.run(promote_leads(
                  limit=64, concurrency=8, hours=24, max_age_days=14
              ))
              promote["operation"] = f"promote_leads_{wave+1}"
              results.append(promote)
              dump(f"promote-{wave+1}", promote)

          # Then consume high-evidence ATS candidates in bounded direct-DB waves.
          for wave in range(4):
              drained = asyncio.run(drain_candidates(limit=16, concurrency=8, hours=24))
              drained["operation"] = f"drain_candidates_{wave+1}"
              results.append(drained)
              dump(f"drain-{wave+1}", drained)

          publication = repair_publication(db, hours=24, limit=200)
          dump("publication", publication)

          final = _verified_snapshot(db, hours=24)
          dump("final", final)
          start = int(baseline.get("new_verified_jobs_window") or 0)
          finish = int(final.get("new_verified_jobs_window") or 0)
          delta = finish - start
          recovered = sorted({
              employer
              for item in results
              for employer in item.get("recovered_employers", [])
          })
          result = {
              "starting_verified": start,
              "ending_verified": finish,
              "verified_delta": delta,
              "starting_active_verified_jobs": int(baseline.get("active_verified_jobs") or 0),
              "ending_active_verified_jobs": int(final.get("active_verified_jobs") or 0),
              "starting_active_verified_openings": int(baseline.get("active_verified_openings") or 0),
              "ending_active_verified_openings": int(final.get("active_verified_openings") or 0),
              "newest_verified_detected_at": final.get("newest_verified_detected_at"),
              "recovered_employers": recovered,
              "claimed_candidates": sum(int(x.get("claimed_candidates") or 0) for x in results),
              "promoted_sources": sum(int(x.get("promoted_sources") or 0) for x in results),
              "operation_reported_delta": sum(int(x.get("verified_jobs_delta") or 0) for x in results),
          }
          dump("result", result)
          print(json.dumps(result, default=str))
          with open("state.env", "w") as f:
              f.write(f"STATE={'success' if delta > 0 else 'failure'}\n")
              f.write(f"DESCRIPTION={delta} verified jobs; {len(recovered)} employers; {result['claimed_candidates']} candidates\n")
          if delta <= 0:
              raise SystemExit(2)
          PY
        continue-on-error: true
      - name: Load result state
        id: state
        if: always()
        shell: bash
        run: |
          if [ -f state.env ]; then source state.env; else STATE=failure; DESCRIPTION="direct conversion incomplete"; fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"
          test -f evidence/result.json && cat evidence/result.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish microdrain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.state.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.state.outputs.description || 'direct conversion incomplete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context "gaia/verified-job-microdrain" --arg description "${DESCRIPTION:0:140}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-job-microdrain-${{ github.run_id }}
          path: evidence/
          retention-days: 30
      - name: Require positive verified delta
        if: always()
        run: test "${{ steps.state.outputs.state || 'failure' }}" = success
