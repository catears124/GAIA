name: Retry runtime coverage deployment

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-coverage-deploy-retry
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check whether runtime coverage is deployed
        id: probe
        shell: bash
        run: |
          status=$(curl --silent --show-error --location \
            --request POST \
            --user-agent 'GAIA-production-maintenance/1' \
            --connect-timeout 5 --max-time 25 \
            --output response.json \
            --write-out '%{http_code}' \
            https://gaiajob.vercel.app/api/maintenance/coverage || echo 000)
          echo "status=${status: -3}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.probe.outputs.status == '404'
        with:
          ref: main
          fetch-depth: 0
      - name: Push one deployment retry per UTC hour
        if: steps.probe.outputs.status == '404'
        shell: bash
        run: |
          set -euo pipefail
          marker=.gaia-runtime-coverage-deploy-retry
          printf '%s\n' "$(date -u +%Y-%m-%dT%H)" > "$marker"
          if git diff --quiet -- "$marker"; then
            echo "This hour's deployment retry is already recorded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "ops: retry runtime coverage deployment"
          git push origin HEAD:main
