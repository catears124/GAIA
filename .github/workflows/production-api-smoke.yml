name: Production API smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-api-smoke
  cancel-in-progress: true

env:
  GAIA_BASE_URL: https://gaiajob.vercel.app

jobs:
  smoke:
    name: Verify deployed UI, recovery assets, and public API contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke evaluator
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Probe production
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p smoke

          fetch() {
            local name="$1" path="$2" max_time="$3" retries="$4"
            if ! curl --silent --show-error --location \
              --connect-timeout 5 --max-time "$max_time" \
              --retry "$retries" --retry-all-errors --retry-delay 1 \
              --dump-header "smoke/${name}.headers" \
              --output "smoke/${name}.body" \
              --write-out '%{http_code}' \
              "${GAIA_BASE_URL}${path}" > "smoke/${name}.status"; then
              printf '000\n' > "smoke/${name}.status"
              : > "smoke/${name}.body"
            fi
          }

          fetch index / 12 1 &
          fetch emergency /assets/emergency-outage.js 12 1 &
          fetch controller /assets/outage-controller.js 12 1 &
          fetch snapshot /assets/last-known-inventory.json 12 1 &
          fetch health /api/health 12 1 &
          fetch stats /api/stats 12 0 &
          fetch families '/api/families?page=1&page_size=12&sort=newest' 12 0 &
          wait

          python -m gaia.production_smoke smoke --output smoke/result.json
          state=$(jq -r '.state' smoke/result.json)
          description=$(jq -r '.description' smoke/result.json)
          snapshot_usable=$(jq -r '.snapshot_usable' smoke/result.json)
          printf '%s\n' "$state" > smoke/state
          printf '%s\n' "$description" > smoke/description
          printf '%s\n' "$snapshot_usable" > smoke/snapshot-usable
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

          {
            echo "### Production smoke"
            echo "- Result: ${state}"
            echo "- Detail: ${description}"
            echo "- Offline snapshot usable: ${snapshot_usable}"
            jq -r '.statuses | to_entries[] | "- \(.key): HTTP \(.value)"' smoke/result.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.probe.outputs.state }}
          DESCRIPTION: ${{ steps.probe.outputs.description }}
        shell: bash
        run: |
          state="${STATE:-failure}"
          description="${DESCRIPTION:-Production smoke did not complete}"
          payload=$(jq -n \
            --arg state "$state" \
            --arg context gaia/production-smoke \
            --arg description "${description:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Upload response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-api-smoke-${{ github.run_id }}
          path: smoke/
          if-no-files-found: error
          retention-days: 14

      - name: Fail invalid production contracts
        if: always()
        shell: bash
        run: |
          state=$(cat smoke/state 2>/dev/null || echo failure)
          test "$state" != failure
