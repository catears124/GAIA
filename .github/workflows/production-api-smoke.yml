name: Production API smoke

on:
  push:
    branches: [main]
    paths:
      - app.py
      - src/gaia/api_resilience.py
      - src/gaia/request_bootstrap.py
      - src/gaia/runtime_bootstrap.py
      - src/gaia/db.py
      - src/gaia/cli.py
      - src/gaia/schema.sql
      - .github/workflows/production-api-smoke.yml
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

concurrency:
  group: production-api-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed UI, recovery assets, and public API contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke evaluator
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Allow production deployment to settle
        if: github.event_name == 'push'
        run: sleep 45

      - name: Resolve active production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          deployments_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?per_page=30"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$deployments_url" > smoke/deployments.json

          mapfile -t deployment_ids < <(
            jq -r '(
              map(select(((.environment // "") | ascii_downcase) == "production"))
              + map(select(((.environment // "") | ascii_downcase) != "production"))
            ) | .[].id' smoke/deployments.json
          )
          base_url=""
          for deployment_id in "${deployment_ids[@]}"; do
            status_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20"
            if ! curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$status_url" > "smoke/deployment-${deployment_id}.json"; then
              continue
            fi
            base_url=$(jq -r '[.[] | select(.state == "success") | .environment_url // empty][0] // empty' \
              "smoke/deployment-${deployment_id}.json")
            if [[ "$base_url" == https://*.vercel.app* ]]; then
              break
            fi
            base_url=""
          done

          if [[ -z "$base_url" ]]; then
            echo "No successful Vercel deployment URL was found" >&2
            exit 1
          fi
          base_url="${base_url%/}"
          printf '%s\n' "$base_url" > smoke/base-url
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "Resolved production URL: $base_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger bounded runtime bootstrap
        env:
          GAIA_BASE_URL: ${{ steps.deployment.outputs.base_url }}
        shell: bash
        run: |
          curl --silent --show-error --location \
            --connect-timeout 5 --max-time 55 \
            --output smoke/bootstrap.body \
            --write-out '%{http_code}\n' \
            "${GAIA_BASE_URL}/api/health" > smoke/bootstrap.status || true

      - name: Probe production
        id: probe
        env:
          GAIA_BASE_URL: ${{ steps.deployment.outputs.base_url }}
        shell: bash
        run: |
          set -uo pipefail

          fetch() {
            local name="$1" path="$2" max_time="$3" retries="$4"
            if ! curl --silent --show-error --location \
              --connect-timeout 5 --max-time "$max_time" \
              --retry "$retries" --retry-all-errors --retry-delay 1 \
              --dump-header "smoke/${name}.headers" \
              --output "smoke/${name}.body" \
              --write-out '%{http_code}' \
              "${GAIA_BASE_URL}${path}" > "smoke/${name}.status"; then
              printf '000\n' > "smoke/${name}.status"
              : > "smoke/${name}.body"
            fi
          }

          fetch index / 12 1 &
          fetch emergency /assets/emergency-outage.js 12 1 &
          fetch controller /assets/outage-controller.js 12 1 &
          fetch snapshot /assets/last-known-inventory.json 12 1 &
          fetch health /api/health 12 1 &
          fetch stats /api/stats 12 0 &
          fetch families '/api/families?page=1&page_size=12&sort=newest' 12 0 &
          wait

          python -m gaia.production_smoke smoke --output smoke/result.json
          state=$(jq -r '.state' smoke/result.json)
          description=$(jq -r '.description' smoke/result.json)
          snapshot_usable=$(jq -r '.snapshot_usable' smoke/result.json)
          printf '%s\n' "$state" > smoke/state
          printf '%s\n' "$description" > smoke/description
          printf '%s\n' "$snapshot_usable" > smoke/snapshot-usable
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

          {
            echo "### Production smoke"
            echo "- URL: ${GAIA_BASE_URL}"
            echo "- Result: ${state}"
            echo "- Detail: ${description}"
            echo "- Offline snapshot usable: ${snapshot_usable}"
            echo "- Bootstrap request: HTTP $(cat smoke/bootstrap.status 2>/dev/null || echo unknown)"
            jq -r '.statuses | to_entries[] | "- \(.key): HTTP \(.value)"' smoke/result.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.probe.outputs.state }}
          DESCRIPTION: ${{ steps.probe.outputs.description }}
        shell: bash
        run: |
          state="${STATE:-failure}"
          description="${DESCRIPTION:-Production smoke did not complete}"
          payload=$(jq -n \
            --arg state "$state" \
            --arg context gaia/production-smoke \
            --arg description "${description:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Upload response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-api-smoke-${{ github.run_id }}
          path: smoke/
          if-no-files-found: error
          retention-days: 14

      - name: Fail invalid production contracts
        if: always()
        shell: bash
        run: |
          state=$(cat smoke/state 2>/dev/null || echo failure)
          test "$state" != failure
