name: Dynamic market discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dynamic-market-discovery.yml"
      - "src/gaia/dynamic_market_discovery.py"
      - "src/gaia/market_discovery.py"
      - "src/gaia/discovery.py"
      - "src/gaia/provider_discovery.py"
      - "src/gaia/source_catalog.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/default_sources.yaml"
      - "pyproject.toml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaia-dynamic-market-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Search fresh internship indexes and validate sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_PRISMA_URL || secrets.POSTGRES_URL || secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "120"
      GAIA_HTTP_TIMEOUT: "45"
      GAIA_READ_ONLY: "0"
      GAIA_GITHUB_TOKEN: ${{ github.token }}
      GAIA_CANDIDATE_PROBE_LIMIT: "96"
      GAIA_WORKER_CONCURRENCY: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate database configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GAIA_DATABASE_URL" || {
            echo "Missing all supported database secrets: POSTGRES_PRISMA_URL, POSTGRES_URL, POSTGRES_URL_NON_POOLING." >&2
            exit 2
          }
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Wait for production database
        run: python -m gaia.wait_for_database --timeout-seconds 120
      - name: Discover and validate fresh employer sources
        shell: bash
        run: |
          set -euo pipefail
          python -m gaia.dynamic_market_discovery \
            --probe-limit "$GAIA_CANDIDATE_PROBE_LIMIT" \
            --concurrency "$GAIA_WORKER_CONCURRENCY" \
            | tee dynamic-market-discovery.json
      - name: Upload discovery evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-market-discovery-${{ github.run_id }}
          path: dynamic-market-discovery.json
          if-no-files-found: warn
          retention-days: 14
