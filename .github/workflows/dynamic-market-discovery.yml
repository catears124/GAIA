name: Dynamic market discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dynamic-market-discovery.yml"
      - "src/gaia/dynamic_market_discovery.py"
      - "src/gaia/market_discovery.py"
      - "src/gaia/discovery.py"
      - "src/gaia/provider_discovery.py"
      - "src/gaia/source_catalog.py"
      - "src/gaia/inventory_runtime.py"
      - "src/gaia/maintenance_api.py"
      - "src/gaia/default_sources.yaml"
      - "tests/test_dynamic_market_discovery.py"
      - "tests/test_market_discovery.py"
      - "pyproject.toml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-dynamic-market-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Search fresh internship indexes and validate sources
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      GAIA_DB_CANDIDATE_GAIA: ${{ secrets.GAIA_DATABASE_URL }}
      GAIA_DB_CANDIDATE_DATABASE: ${{ secrets.DATABASE_URL }}
      GAIA_DB_CANDIDATE_SUPABASE: ${{ secrets.SUPABASE_DB_URL }}
      GAIA_DB_CANDIDATE_PRISMA: ${{ secrets.POSTGRES_PRISMA_URL }}
      GAIA_DB_CANDIDATE_POSTGRES: ${{ secrets.POSTGRES_URL }}
      GAIA_DB_CANDIDATE_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      GAIA_DB_COMPONENT_HOST: ${{ secrets.POSTGRES_HOST }}
      GAIA_DB_COMPONENT_PORT: ${{ secrets.POSTGRES_PORT }}
      GAIA_DB_COMPONENT_USER: ${{ secrets.POSTGRES_USER }}
      GAIA_DB_COMPONENT_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GAIA_DB_COMPONENT_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
      GAIA_MAINTENANCE_TOKEN: ${{ secrets.GAIA_MAINTENANCE_TOKEN }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "45"
      GAIA_HTTP_TIMEOUT: "15"
      GAIA_READ_ONLY: "0"
      GAIA_GITHUB_TOKEN: ${{ github.token }}
      GAIA_CANDIDATE_PROBE_LIMIT: "16"
      GAIA_STATELESS_AUDIT_LIMIT: "16"
      GAIA_WORKER_CONCURRENCY: "8"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending discovery status
        shell: bash
        run: |
          payload=$(jq -n --arg state pending --arg context gaia/dynamic-market-discovery --arg description "Searching fresh internship indexes and validating employer sources" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify discovery lane
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/gaia/dynamic_market_discovery.py \
            src/gaia/market_discovery.py \
            tests/test_dynamic_market_discovery.py \
            tests/test_market_discovery.py
          pytest -q \
            tests/test_dynamic_market_discovery.py \
            tests/test_market_discovery.py
      - name: Search fresh public internship indexes
        shell: bash
        run: |
          set -euo pipefail
          python -m gaia.dynamic_market_discovery \
            --search-only \
            --snapshot-output dynamic-market-snapshot.json \
            --concurrency "$GAIA_WORKER_CONCURRENCY" \
            | tee dynamic-market-search.json
      - name: Select a working production database credential
        id: database
        shell: bash
        run: |
          set -euo pipefail
          component_candidate=""
          if [ -n "${GAIA_DB_COMPONENT_HOST:-}" ] \
             && [ -n "${GAIA_DB_COMPONENT_USER:-}" ] \
             && [ -n "${GAIA_DB_COMPONENT_PASSWORD:-}" ] \
             && [ -n "${GAIA_DB_COMPONENT_DATABASE:-}" ]; then
            component_candidate=$(python - <<'PY'
          import os
          from urllib.parse import quote

          host = os.environ["GAIA_DB_COMPONENT_HOST"].strip()
          port = os.getenv("GAIA_DB_COMPONENT_PORT", "").strip()
          user = quote(os.environ["GAIA_DB_COMPONENT_USER"], safe="")
          password = quote(os.environ["GAIA_DB_COMPONENT_PASSWORD"], safe="")
          database = quote(os.environ["GAIA_DB_COMPONENT_DATABASE"], safe="")
          authority = host if not port or host.rsplit(":", 1)[-1] == port else f"{host}:{port}"
          print(f"postgresql://{user}:{password}@{authority}/{database}?sslmode=require")
          PY
            )
            echo "::add-mask::$component_candidate"
          fi

          selected=""
          attempted=0
          # Background workers prefer the direct endpoint. Pooler URLs remain fallback
          # credentials only; Supavisor checkout contention previously wedged this lane.
          for name in \
            GAIA_DB_CANDIDATE_NON_POOLING \
            GAIA_DB_CANDIDATE_POSTGRES \
            GAIA_DB_CANDIDATE_PRISMA \
            GAIA_DB_CANDIDATE_GAIA \
            GAIA_DB_CANDIDATE_DATABASE \
            GAIA_DB_CANDIDATE_SUPABASE \
            component_candidate
          do
            if [ "$name" = component_candidate ]; then
              candidate="$component_candidate"
            else
              candidate="${!name:-}"
            fi
            if [ -z "$candidate" ]; then
              continue
            fi
            attempted=$((attempted + 1))
            echo "::add-mask::$candidate"
            set +e
            GAIA_DATABASE_URL="$candidate" python -m gaia.wait_for_database --timeout-seconds 20
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              selected="$candidate"
              echo "Selected working database candidate: $name"
              break
            fi
            echo "Database candidate $name rejected with readiness code $code."
          done

          if [ -z "$selected" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$attempted" -eq 0 ]; then
              echo "reason=no-database-secrets" >> "$GITHUB_OUTPUT"
              echo "Discovery evidence captured, but no production database secrets are configured." >&2
            else
              echo "reason=stale-database-secrets" >> "$GITHUB_OUTPUT"
              echo "Discovery evidence captured, but every configured production database credential is stale or invalid." >&2
            fi
            exit 0
          fi

          delimiter="GAIA_DB_$(openssl rand -hex 12)"
          {
            echo "GAIA_DATABASE_URL<<$delimiter"
            echo "$selected"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "reason=ready" >> "$GITHUB_OUTPUT"
      - name: Validate and schedule discovered employer sources
        id: ingest
        if: steps.database.outputs.ready == 'true'
        shell: bash
        run: |
          set -uo pipefail
          # A bounded slice is better than a 15-minute monolith. save_candidates and
          # each completed promotion commit independently; remaining candidates stay
          # available for the next scheduled pulse.
          timeout --signal=TERM --kill-after=10s 210s \
            python -m gaia.dynamic_market_discovery \
              --snapshot-input dynamic-market-snapshot.json \
              --probe-limit "$GAIA_CANDIDATE_PROBE_LIMIT" \
              --concurrency "$GAIA_WORKER_CONCURRENCY" \
            | tee dynamic-market-ingest.json
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "state=partial" >> "$GITHUB_OUTPUT"
            echo "Discovery ingest reached its 210s budget; committed progress is retained."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "state=complete" >> "$GITHUB_OUTPUT"
      - name: Audit official boards while database credentials are stale
        if: steps.database.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            python -m gaia.dynamic_market_discovery \
              --audit-only \
              --snapshot-input dynamic-market-snapshot.json \
              --snapshot-output dynamic-market-snapshot.json \
              --audit-probe-limit "$GAIA_STATELESS_AUDIT_LIMIT" \
              --concurrency "$GAIA_WORKER_CONCURRENCY" \
            | tee dynamic-market-audit.json
      - name: Bridge discovered sources through production runtime
        id: runtime_bridge
        if: steps.database.outputs.ready != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          auth=()
          if [ -n "${GAIA_MAINTENANCE_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer ${GAIA_MAINTENANCE_TOKEN}")
          fi
          http_code=$(curl \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 45 \
            --output dynamic-market-production-ingest.json \
            --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GAIA-production-maintenance/${GITHUB_RUN_ID}" \
            "${auth[@]}" \
            --data-binary @dynamic-market-snapshot.json \
            https://gaiajob.vercel.app/api/maintenance/dynamic-sources)
          echo "$http_code" > dynamic-market-production-ingest.status
          cat dynamic-market-production-ingest.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Production runtime source bridge returned HTTP $http_code." >&2
            exit 1
          fi
          jq -e 'type == "object" and (.status | IN("ok", "not_due")) and (.executed | type == "boolean")' dynamic-market-production-ingest.json >/dev/null
      - name: Publish discovery summary
        if: always()
        shell: bash
        run: |
          echo "### Dynamic market discovery" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -f dynamic-market-search.json ]; then cat dynamic-market-search.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f dynamic-market-audit.json ]; then cat dynamic-market-audit.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f dynamic-market-ingest.json ]; then cat dynamic-market-ingest.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f dynamic-market-production-ingest.json ]; then cat dynamic-market-production-ingest.json >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Database state: ${{ steps.database.outputs.reason || 'not-checked' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ingest state: ${{ steps.ingest.outputs.state || 'not-run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime bridge: ${{ steps.runtime_bridge.outcome || 'not-needed' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload discovery evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-market-discovery-${{ github.run_id }}
          path: |
            dynamic-market-snapshot.json
            dynamic-market-search.json
            dynamic-market-audit.json
            dynamic-market-ingest.json
            dynamic-market-production-ingest.json
            dynamic-market-production-ingest.status
          if-no-files-found: warn
          retention-days: 14
      - name: Publish final discovery status
        if: always()
        shell: bash
        run: |
          database_ready="${{ steps.database.outputs.ready }}"
          bridge_outcome="${{ steps.runtime_bridge.outcome }}"
          ingest_state="${{ steps.ingest.outputs.state }}"
          if [ "${{ job.status }}" != success ]; then
            state=failure
            description="Dynamic market search or employer source validation failed"
          elif [ "$database_ready" = true ] && [ "$ingest_state" = partial ]; then
            state=pending
            description="Fresh market search committed a bounded source-validation slice"
          elif [ "$database_ready" = true ]; then
            state=success
            description="Fresh market search and bounded source validation completed"
          elif [ "$bridge_outcome" = success ]; then
            state=success
            description="Fresh source candidates delivered through production runtime"
          else
            state=pending
            description="Fresh source evidence captured; runtime bridge awaits deployment"
          fi
          payload=$(jq -n --arg state "$state" --arg context gaia/dynamic-market-discovery --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
