name: Dynamic market discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dynamic-market-discovery.yml"
      - "src/gaia/dynamic_market_discovery.py"
      - "src/gaia/market_candidate_capture.py"
      - "src/gaia/market_discovery.py"
      - "src/gaia/discovery.py"
      - "src/gaia/provider_discovery.py"
      - "src/gaia/source_catalog.py"
      - "src/gaia/default_sources.yaml"
      - "tests/test_dynamic_market_discovery.py"
      - "tests/test_market_discovery.py"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-dynamic-market-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Search market and capture source candidates
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING || secrets.POSTGRES_URL || secrets.POSTGRES_PRISMA_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "45"
      GAIA_HTTP_TIMEOUT: "15"
      GAIA_GITHUB_TOKEN: ${{ github.token }}
      GAIA_WORKER_CONCURRENCY: "8"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish pending discovery status
        shell: bash
        run: |
          payload=$(jq -n \
            --arg state pending \
            --arg context gaia/dynamic-market-discovery \
            --arg description "Searching internship indexes and capturing source candidates" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GAIA and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify discovery search lane
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/gaia/dynamic_market_discovery.py \
            src/gaia/market_candidate_capture.py \
            src/gaia/market_discovery.py \
            tests/test_dynamic_market_discovery.py \
            tests/test_market_discovery.py
          pytest -q tests/test_dynamic_market_discovery.py tests/test_market_discovery.py

      - name: Require direct production database
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GAIA_DATABASE_URL"
          python -m gaia.wait_for_database --timeout-seconds 30

      - name: Search fresh public internship indexes
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            python -m gaia.dynamic_market_discovery \
              --search-only \
              --snapshot-output dynamic-market-snapshot.json \
              --concurrency "$GAIA_WORKER_CONCURRENCY" \
            | tee dynamic-market-search.json

      - name: Persist candidate evidence in small commits
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            python -m gaia.market_candidate_capture \
              --snapshot-input dynamic-market-snapshot.json \
              --batch-size 250 \
            | tee dynamic-market-capture.json
          description=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dynamic-market-capture.json").read_text())
          print(
              f"Market: {data.get('market_postings', 0)} postings, "
              f"{data.get('default_target_postings', 0)} target; "
              f"captured {data.get('candidate_rows_written', 0)} candidates"
          )
          PY
          )
          echo "description=${description:0:140}" >> "$GITHUB_OUTPUT"

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-market-discovery-${{ github.run_id }}
          path: |
            dynamic-market-snapshot.json
            dynamic-market-search.json
            dynamic-market-capture.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish final discovery status
        if: always()
        shell: bash
        env:
          DESCRIPTION: ${{ steps.capture.outputs.description || 'Dynamic market discovery failed' }}
        run: |
          if [ "${{ steps.capture.outcome }}" = success ]; then state=success; else state=failure; fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context gaia/dynamic-market-discovery \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
