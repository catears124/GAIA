name: Candidate source drain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/candidate-drain.yml"
      - "src/gaia/candidate_drain.py"
      - "src/gaia/fast_dynamic_ingest.py"
      - "src/gaia/live_inventory.py"
      - "src/gaia/source_catalog.py"
      - "src/gaia/discord_notify_fast.py"
  workflow_run:
    workflows: ["Dynamic market discovery"]
    types: [completed]
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-candidate-source-drain
  cancel-in-progress: true

jobs:
  drain:
    name: Probe and promote source candidates
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING || secrets.POSTGRES_URL || secrets.POSTGRES_PRISMA_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "45"
      GAIA_HTTP_TIMEOUT: "12"
      GAIA_DISCORD_BOOTSTRAP_LOOKBACK_MINUTES: "180"
      GAIA_DISCORD_MAX_PER_CHANNEL: "250"
      VERIFIED_DHOOK: ${{ secrets.VERIFIED_DHOOK }}
      LEADS_DHOOK: ${{ secrets.LEADS_DHOOK }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .

      - name: Require direct DB and Discord
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GAIA_DATABASE_URL"
          test -n "$VERIFIED_DHOOK"
          test -n "$LEADS_DHOOK"

      - name: Probe, promote, publish, and alert
        id: drain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          timeout --signal=TERM --kill-after=10s 130s \
            python -m gaia.candidate_drain --limit 32 --concurrency 8 \
            | tee evidence/candidate-drain.json
          description=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("evidence/candidate-drain.json").read_text())
          notify = data.get("notifications") or {}
          channels = notify.get("channels") or {}
          sent = sum(int((channels.get(name) or {}).get("sent", 0)) for name in ("verified", "leads"))
          print(
              f"Candidates probed={data.get('candidate_sources_probed', 0)} "
              f"promoted={data.get('candidate_sources_promoted', 0)} "
              f"Discord sent={sent}"
          )
          PY
          )
          echo "description=${description:0:140}" >> "$GITHUB_OUTPUT"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-drain-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish candidate-drain status
        if: always()
        shell: bash
        env:
          DESCRIPTION: ${{ steps.drain.outputs.description || 'Candidate source drain failed' }}
        run: |
          if [ "${{ steps.drain.outcome }}" = success ]; then state=success; else state=failure; fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "gaia/candidate-drain" \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
