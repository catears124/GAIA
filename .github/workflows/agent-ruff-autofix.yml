name: Agent Ruff autofix

on:
  push:
    branches: [agent/single-source-resilience]
    paths:
      - ".github/workflows/agent-ruff-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-source-resilience
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.1
      - name: Apply deterministic Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --fix
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "gaia-lint-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply deterministic Ruff fixes"
          git push origin HEAD:agent/single-source-resilience
