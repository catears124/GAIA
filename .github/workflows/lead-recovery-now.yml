name: Verified lead recovery now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lead-recovery-now.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gaia-lead-recovery-now-v2
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(jq -n --arg state pending --arg context gaia/lead-recovery-now \
            --arg description "Repairing verified read model and promoting fresh leads" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"

      - name: Repair publication, promote leads, and verify exact filter
        id: recovery
        env:
          BASE_URL: https://gaiajob.vercel.app
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          ua="GAIA-production-maintenance/${GITHUB_RUN_ID}"
          report() {
            curl --fail --silent --show-error --location --user-agent "$ua" \
              --connect-timeout 15 --max-time 180 --retry 2 --retry-all-errors --retry-delay 3 \
              "${BASE_URL}/api/maintenance/diagnostics/conversion?hours=24&limit=100"
          }
          recent() {
            curl --fail --silent --show-error --location --user-agent "$ua" \
              --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 \
              "${BASE_URL}/api/families?trust=verified&posted_within=1&page=1&page_size=12"
          }
          repair() {
            local label="$1"
            local attempt code rebuilt gaps
            for attempt in $(seq 1 10); do
              code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
                --connect-timeout 10 --max-time 55 \
                --output "evidence/repair-${label}-${attempt}.json" --write-out '%{http_code}' \
                "${BASE_URL}/api/maintenance/diagnostics/repair-publication?limit=200&hours=24" || printf 000)
              if [ "$code" = 200 ]; then
                rebuilt=$(jq -r '.families_rebuilt // 0' "evidence/repair-${label}-${attempt}.json" 2>/dev/null || echo 0)
                gaps=$(jq -r '.publication_gaps_after // 999999' "evidence/repair-${label}-${attempt}.json" 2>/dev/null || echo 999999)
                if [ "$rebuilt" -gt 0 ] || [ "$gaps" -eq 0 ]; then
                  return 0
                fi
              fi
              sleep 3
            done
            return 1
          }
          promote() {
            local i="$1"
            local code
            code=$(curl --silent --show-error --location --request POST --user-agent "$ua" \
              --connect-timeout 10 --max-time 50 \
              --output "evidence/promote-${i}.json" --write-out '%{http_code}' \
              "${BASE_URL}/api/maintenance/diagnostics/promote-leads?limit=12&concurrency=6&hours=24&max_age_days=14&timeout_seconds=45" || printf 000)
            printf '%s\n' "$code" > "evidence/promote-${i}.status"
          }

          report > evidence/before.json
          recent > evidence/recent-before.json
          before=$(jq -r '.funnel.new_verified_jobs_window // 0' evidence/before.json)
          recent_before=$(jq -r '.total // 0' evidence/recent-before.json)
          active_before=$(jq -r '.funnel.active_verified_jobs // 0' evidence/before.json)
          openings_before=$(jq -r '.funnel.active_verified_openings // 0' evidence/before.json)

          repair initial || true
          for i in $(seq 1 8); do
            promote "$i"
            if [ $((i % 2)) -eq 0 ]; then
              repair "wave-$((i / 2))" || true
            fi
          done
          repair final
          sleep 8

          report > evidence/after.json
          recent > evidence/recent-after.json
          after=$(jq -r '.funnel.new_verified_jobs_window // 0' evidence/after.json)
          recent_after=$(jq -r '.total // 0' evidence/recent-after.json)
          active_after=$(jq -r '.funnel.active_verified_jobs // 0' evidence/after.json)
          openings_after=$(jq -r '.funnel.active_verified_openings // 0' evidence/after.json)
          delta=$((after-before))
          recent_delta=$((recent_after-recent_before))
          active_delta=$((active_after-active_before))
          opening_delta=$((openings_after-openings_before))
          selected=$(jq -s '[.[] | .selected_leads // 0] | add // 0' evidence/promote-*.json 2>/dev/null || echo 0)
          recovered=$(jq -s '[.[] | .recovered_verified_openings // 0] | add // 0' evidence/promote-*.json 2>/dev/null || echo 0)
          verified_leads=$(jq -s '[.[] | .verified_leads // 0] | add // 0' evidence/promote-*.json 2>/dev/null || echo 0)
          closed=$(jq -s '[.[] | .closed_leads // 0] | add // 0' evidence/promote-*.json 2>/dev/null || echo 0)
          completed=$(jq -s '[.[] | select(.status == "ok")] | length' evidence/promote-*.json 2>/dev/null || echo 0)

          jq -n \
            --argjson before "$before" --argjson after "$after" --argjson delta "$delta" \
            --argjson recent_before "$recent_before" --argjson recent_after "$recent_after" --argjson recent_delta "$recent_delta" \
            --argjson active_before "$active_before" --argjson active_after "$active_after" --argjson active_delta "$active_delta" \
            --argjson openings_before "$openings_before" --argjson openings_after "$openings_after" --argjson opening_delta "$opening_delta" \
            --argjson selected "$selected" --argjson recovered "$recovered" --argjson verified_leads "$verified_leads" \
            --argjson closed "$closed" --argjson completed "$completed" \
            '{starting_verified_window:$before,ending_verified_window:$after,verified_window_delta:$delta,starting_exact_recent_filter:$recent_before,ending_exact_recent_filter:$recent_after,exact_recent_filter_delta:$recent_delta,starting_active_verified_jobs:$active_before,ending_active_verified_jobs:$active_after,active_verified_jobs_delta:$active_delta,starting_active_verified_openings:$openings_before,ending_active_verified_openings:$openings_after,active_verified_openings_delta:$opening_delta,lead_pages_selected:$selected,recovered_verified_openings:$recovered,verified_leads:$verified_leads,closed_leads:$closed,completed_batches:$completed}' \
            > evidence/result.json

          if [ "$recent_delta" -gt 0 ] || [ "$delta" -gt 0 ] || [ "$active_delta" -gt 0 ]; then state=success; else state=failure; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=filter ${recent_before}->${recent_after} (${recent_delta}); active ${active_before}->${active_after} (${active_delta}); recovered ${recovered}" >> "$GITHUB_OUTPUT"
          cat evidence/result.json >> "$GITHUB_STEP_SUMMARY"
          test "$state" = success

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.recovery.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.recovery.outputs.description || 'Verified lead recovery did not complete' }}
        shell: bash
        run: |
          payload=$(jq -n --arg state "$STATE" --arg context gaia/lead-recovery-now \
            --arg description "${DESCRIPTION:0:140}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-lead-recovery-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
