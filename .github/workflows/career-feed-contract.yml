name: Career feed discovery contract

on:
  pull_request:
    paths:
      - ".github/workflows/career-feed-contract.yml"
      - "src/gaia/career_surface_collector.py"
      - "tests/test_career_surface_feeds.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/career-feed-contract.yml"
      - "src/gaia/career_surface_collector.py"
      - "tests/test_career_surface_feeds.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-feed-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint career discovery
        run: ruff check src/gaia/career_surface_collector.py tests/test_career_surface_feeds.py
      - name: Verify career feed discovery
        run: pytest -q tests/test_career_surface_feeds.py
