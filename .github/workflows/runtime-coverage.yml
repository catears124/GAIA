name: Runtime employer coverage diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-employer-coverage-diagnostic
  cancel-in-progress: true

jobs:
  reconcile:
    name: Run one manual Vercel coverage pulse
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger bounded runtime coverage reconcile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          status=$(curl --silent --show-error --location \
            --request POST \
            --user-agent "GAIA-production-maintenance/${GITHUB_RUN_ID}" \
            --connect-timeout 10 --max-time 60 \
            --dump-header evidence/coverage.headers \
            --output evidence/coverage.json \
            --write-out '%{http_code}' \
            https://gaiajob.vercel.app/api/maintenance/coverage || printf '000')
          cat evidence/coverage.json || true
          test "$status" = 200
          jq -e 'type == "object" and (.status | IN("ok", "not_due"))' evidence/coverage.json >/dev/null

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-coverage-diagnostic-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
