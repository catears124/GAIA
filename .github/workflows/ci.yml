name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - name: Install
        run: set -o pipefail; python -m pip install -e ".[dev]" 2>&1 | tee install.log
      - name: Ruff
        run: set -o pipefail; ruff check . 2>&1 | tee lint.log
      - name: Compile
        run: set -o pipefail; python -m compileall -q src tests scripts 2>&1 | tee compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-diagnostics
          path: "*.log"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install
        run: set -o pipefail; python -m pip install -e ".[dev]" 2>&1 | tee install.log
      - name: Pytest
        run: set -o pipefail; pytest -q 2>&1 | tee pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.python-version }}-diagnostics
          path: "*.log"

  live-recall:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m gaia.audit
