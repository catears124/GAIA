name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  autofix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trust-ui-reconcile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          census = Path("src/gaia/employer_census.py")
          text = census.read_text(encoding="utf-8")
          text = text.replace(
              'not in {"ycombinator.com", "www.ycombinator.com"}',
              "not in EXCLUDED_PROFILE_HOSTS",
          )
          text = text.replace('.encode("utf-8")', ".encode()")
          census.write_text(text, encoding="utf-8")
          PY
          ruff check . --fix
          rm -f .github/workflows/branch-autofix.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply reviewed employer census fixes"
          git push origin HEAD:agent/trust-ui-reconcile

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff-report.txt
      - name: Generate Ruff autofix patch
        if: failure()
        shell: bash
        run: ruff check . --fix --diff > ruff-fix.diff || true
      - name: Compile all Python modules
        if: success()
        run: python -m compileall -q src tests scripts
      - name: Publish lint report
        if: always()
        shell: bash
        run: |
          echo "### Ruff" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ruff-report.txt ]; then
            cat ruff-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ruff did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            ruff-report.txt
            ruff-fix.diff
          if-no-files-found: warn
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    env:
      GAIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_INITIAL_SYNC: "0"
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres dropdb --if-exists gaia_test
          sudo -u postgres createdb gaia_test
          for attempt in {1..15}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready." >&2
          exit 1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: gaia migrate
      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            --junitxml="pytest-${{ matrix.python-version }}.xml" \
            2>&1 | tee "pytest-${{ matrix.python-version }}.txt"
      - name: Publish test report
        if: always()
        shell: bash
        run: |
          echo "### Pytest · Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "pytest-${{ matrix.python-version }}.txt" ]; then
            tail -n 200 "pytest-${{ matrix.python-version }}.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pytest did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest-${{ matrix.python-version }}.txt
            pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  live-recall:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m gaia.audit
