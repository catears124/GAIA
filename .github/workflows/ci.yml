name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  autofix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trust-ui-reconcile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Apply reviewed hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          census = Path("src/gaia/employer_census.py")
          text = census.read_text(encoding="utf-8")
          if "import logging\n" not in text:
              text = text.replace("import hashlib\n", "import hashlib\nimport logging\n")
          logger_anchor = "from .universe import _employer_key\n"
          if "LOGGER = logging.getLogger" not in text:
              text = text.replace(
                  logger_anchor,
                  logger_anchor + '\nLOGGER = logging.getLogger("gaia.employer-census")\n',
              )
          old = '''            response = await client.get(url)
            response.raise_for_status()
            source = str(item.get("name") or url)
            observations = _yc_observations(
                response.text,
                url=url,
                source=source,
                sectors=[str(value) for value in item.get("sectors") or []],
            )
            observed += _upsert_observations(
                database,
                source=f"yc:{source}",
                evidence_type="startup-ecosystem",
                internship_signal=float(item.get("internship_signal") or 0.32),
                technical_signal=float(item.get("technical_signal") or 0.86),
                observations=observations,
            )'''
          new = '''            source = str(item.get("name") or url)
            try:
                response = await client.get(url)
                response.raise_for_status()
                observations = _yc_observations(
                    response.text,
                    url=url,
                    source=source,
                    sectors=[str(value) for value in item.get("sectors") or []],
                )
                observed += _upsert_observations(
                    database,
                    source=f"yc:{source}",
                    evidence_type="startup-ecosystem",
                    internship_signal=float(item.get("internship_signal") or 0.32),
                    technical_signal=float(item.get("technical_signal") or 0.86),
                    observations=observations,
                )
            except (httpx.HTTPError, ValueError, TypeError) as exc:
                LOGGER.warning("employer ecosystem feed failed: %s: %r", source, exc)'''
          if old not in text:
              raise SystemExit("expected ecosystem refresh block not found")
          census.write_text(text.replace(old, new), encoding="utf-8")

          workflow = Path(".github/workflows/inventory.yml")
          text = workflow.read_text(encoding="utf-8")
          old = '''    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Serialize global reconciliation
        run: gaia reconcile'''
          new = '''    env:
      GAIA_DATABASE_URL: ${{ secrets.POSTGRES_URL }}
      GAIA_AUTO_MIGRATE: "0"
      GAIA_DB_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install GAIA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Serialize global reconciliation
        run: gaia reconcile'''
          if old not in text:
              raise SystemExit("expected reconciliation workflow block not found")
          workflow.write_text(text.replace(old, new), encoding="utf-8")

          hosted = Path("tests/test_hosted_inventory.py")
          text = hosted.read_text(encoding="utf-8")
          text = text.replace(
              "from datetime import UTC, datetime, timedelta\n",
              "from datetime import UTC, datetime, timedelta\n\nimport pytest\n",
          )
          text = text.replace(
              "from gaia.live_inventory import LiveDatabase, LiveInventoryStore\n",
              "from gaia.inventory import WorkerSummary\n"
              "from gaia.inventory_runtime import InventoryWorker as RuntimeInventoryWorker\n"
              "from gaia.live_inventory import (\n"
              "    InventoryWorker as LiveInventoryWorker,\n"
              "    LiveDatabase,\n"
              "    LiveInventoryStore,\n"
              ")\n",
          )
          marker = "test_live_lane_defers_global_family_rebuild"
          if marker not in text:
              text += '''\n\n@pytest.mark.asyncio
async def test_live_lane_defers_global_family_rebuild(tmp_path, monkeypatch) -> None:
    database = Database(tmp_path / "deferred-rebuild.db")
    rebuilds = 0

    def rebuild() -> None:
        nonlocal rebuilds
        rebuilds += 1

    async def fake_runtime_run(
        worker: RuntimeInventoryWorker,
        *,
        once: bool = False,
        budget_seconds: float | None = None,
    ) -> WorkerSummary:
        del once, budget_seconds
        worker.database.rebuild_families()
        return WorkerSummary()

    monkeypatch.setattr(database, "rebuild_families", rebuild)
    monkeypatch.setattr(RuntimeInventoryWorker, "run", fake_runtime_run)
    monkeypatch.setenv("GAIA_DEFER_FAMILY_REBUILD", "1")

    worker = LiveInventoryWorker(database, concurrency=1)
    await worker.run(once=True, budget_seconds=1)

    assert rebuilds == 0
    database.rebuild_families()
    assert rebuilds == 1
'''
          hosted.write_text(text, encoding="utf-8")

          universe_tests = Path("tests/test_employer_universe.py")
          text = universe_tests.read_text(encoding="utf-8")
          if "from gaia.health import production_report\n" not in text:
              text = text.replace(
                  "from gaia.employer_census import (\n",
                  "from gaia.employer_census import (\n",
              ).replace(
                  "from gaia.models import CollectorResult, Posting\n",
                  "from gaia.health import production_report\n"
                  "from gaia.models import CollectorResult, Posting\n",
              )
          marker = "test_production_checker_can_require_employer_universe"
          if marker not in text:
              text += '''\n\ndef test_production_checker_can_require_employer_universe(tmp_path) -> None:
    database = Database(tmp_path / "missing-universe.db")

    report = production_report(
        database,
        min_sources=1,
        min_active_listings=1,
        require_universe=True,
    )

    assert report["ok"] is False
    assert "employer universe read model is missing" in report["errors"]
'''
          universe_tests.write_text(text, encoding="utf-8")
          PY
          ruff check . --fix
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden employer census and reconciliation"
          git push origin HEAD:agent/trust-ui-reconcile

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff-report.txt
      - name: Generate Ruff autofix patch
        if: failure()
        shell: bash
        run: ruff check . --fix --diff > ruff-fix.diff || true
      - name: Compile all Python modules
        if: success()
        run: python -m compileall -q src tests scripts
      - name: Publish lint report
        if: always()
        shell: bash
        run: |
          echo "### Ruff" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ruff-report.txt ]; then
            cat ruff-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ruff did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            ruff-report.txt
            ruff-fix.diff
          if-no-files-found: warn
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    env:
      GAIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_INITIAL_SYNC: "0"
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres dropdb --if-exists gaia_test
          sudo -u postgres createdb gaia_test
          for attempt in {1..15}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready." >&2
          exit 1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: gaia migrate
      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            --junitxml="pytest-${{ matrix.python-version }}.xml" \
            2>&1 | tee "pytest-${{ matrix.python-version }}.txt"
      - name: Publish test report
        if: always()
        shell: bash
        run: |
          echo "### Pytest · Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "pytest-${{ matrix.python-version }}.txt" ]; then
            tail -n 200 "pytest-${{ matrix.python-version }}.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pytest did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest-${{ matrix.python-version }}.txt
            pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  live-recall:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m gaia.audit
