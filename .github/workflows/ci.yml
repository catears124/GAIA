name: CI

on:
  push:
    paths-ignore:
      - "src/gaia/frontend/last-known-inventory.json"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff-report.txt
      - name: Generate Ruff autofix patch
        if: failure()
        shell: bash
        run: ruff check . --fix --diff > ruff-fix.diff || true
      - name: Compile all Python modules
        if: success()
        run: python -m compileall -q src tests scripts
      - name: Publish lint report
        if: always()
        shell: bash
        run: |
          echo "### Ruff" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ruff-report.txt ]; then
            cat ruff-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ruff did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            ruff-report.txt
            ruff-fix.diff
          if-no-files-found: warn
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GAIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gaia_test
      GAIA_INITIAL_SYNC: "0"
      GAIA_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify isolated PostgreSQL
        shell: bash
        run: |
          for attempt in {1..15}; do
            if PGPASSWORD=postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres -d gaia_test; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL service did not become ready." >&2
          exit 1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: gaia migrate
      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            --junitxml="pytest-${{ matrix.python-version }}.xml" \
            2>&1 | tee "pytest-${{ matrix.python-version }}.txt"
      - name: Publish test report
        if: always()
        shell: bash
        run: |
          echo "### Pytest · Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "pytest-${{ matrix.python-version }}.txt" ]; then
            tail -n 200 "pytest-${{ matrix.python-version }}.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pytest did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest-${{ matrix.python-version }}.txt
            pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  live-recall:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m gaia.audit
