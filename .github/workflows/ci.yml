name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Runner probe reached for ${context.sha}.`
            });

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - name: Install
        id: install
        continue-on-error: true
        run: set -o pipefail; python -m pip install -e ".[dev]" 2>&1 | tee install.log
      - name: Ruff
        id: ruff
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; ruff check . 2>&1 | tee lint.log
      - name: Compile
        id: compile
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; python -m compileall -q src tests scripts 2>&1 | tee compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-diagnostics
          path: "*.log"
          if-no-files-found: ignore
      - name: Report failure
        if: always() && github.event_name == 'pull_request' && (steps.install.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.compile.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (name) => fs.existsSync(name) ? fs.readFileSync(name, 'utf8').slice(-12000) : '(not run)';
            const body = `### CI diagnostics: lint\n\n**install:** ${'${{ steps.install.outcome }}'}  \n**ruff:** ${'${{ steps.ruff.outcome }}'}  \n**compile:** ${'${{ steps.compile.outcome }}'}\n\n\`\`\`text\n${read('install.log')}\n${read('lint.log')}\n${read('compile.log')}\n\`\`\``;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      - name: Fail job
        if: steps.install.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.compile.outcome == 'failure'
        run: exit 1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install
        id: install
        continue-on-error: true
        run: set -o pipefail; python -m pip install -e ".[dev]" 2>&1 | tee install.log
      - name: Pytest
        id: pytest
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; pytest -q 2>&1 | tee pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.python-version }}-diagnostics
          path: "*.log"
          if-no-files-found: ignore
      - name: Report failure
        if: always() && github.event_name == 'pull_request' && (steps.install.outcome == 'failure' || steps.pytest.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (name) => fs.existsSync(name) ? fs.readFileSync(name, 'utf8').slice(-12000) : '(not run)';
            const body = `### CI diagnostics: Python ${'${{ matrix.python-version }}'}\n\n**install:** ${'${{ steps.install.outcome }}'}  \n**pytest:** ${'${{ steps.pytest.outcome }}'}\n\n\`\`\`text\n${read('install.log')}\n${read('pytest.log')}\n\`\`\``;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      - name: Fail job
        if: steps.install.outcome == 'failure' || steps.pytest.outcome == 'failure'
        run: exit 1

  live-recall:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m gaia.audit
