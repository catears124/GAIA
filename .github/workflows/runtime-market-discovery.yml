name: Runtime market discovery diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-market-discovery-diagnostic
  cancel-in-progress: true

jobs:
  discover:
    name: Run one manual Vercel discovery pulse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger bounded runtime market discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          status=$(curl --silent --show-error --location \
            --request POST \
            --user-agent "GAIA-production-maintenance/${GITHUB_RUN_ID}" \
            --connect-timeout 15 --max-time 240 \
            --dump-header evidence/discovery.headers \
            --output evidence/discovery.json \
            --write-out '%{http_code}' \
            https://gaiajob.vercel.app/api/maintenance/discover || printf '000')
          cat evidence/discovery.json || true
          test "$status" = 200
          jq -e 'type == "object" and (.status | IN("ok", "empty", "not_due"))' evidence/discovery.json >/dev/null

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-market-discovery-diagnostic-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
