# Provider-level sources are allowed here; employers are discovered from data, not named in code.
native_sources:
  - kind: google-careers

workday:
  # Keep the query basis narrow. The Workday shared edge is globally paced and retries 429s;
  # broad terms such as student, university, campus, and summer are intentionally rejected.
  search_terms:
    - intern
    - co-op

market_discovery:
  github:
    enabled: true
    repos_per_query: 30
    max_repositories: 300
    pushed_within_days: 365
    queries:
      - '"2027 internships" in:name,description,readme'
      - '"Summer 2027" internships in:name,description,readme'
      - '"2027 SWE" internships in:name,description,readme'
      - '"2027 software" internship in:name,description,readme'
      - '"2027 data" internship in:name,description,readme'
      - '"2027 machine learning" internship in:name,description,readme'
      - '"2027 artificial intelligence" internship in:name,description,readme'
      - '"2027 computer vision" internship in:name,description,readme'
      - '"2027 research" internship in:name,description,readme'
      - '"2027 scientific computing" internship in:name,description,readme'
      - '"2027 bioinformatics" internship in:name,description,readme'
      - '"2027 hardware" internship in:name,description,readme'
