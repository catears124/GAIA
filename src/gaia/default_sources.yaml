target_registries:
  - kind: json
    name: vansh-2027
    url: https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json
  - kind: markdown
    name: zapply-2027
    url: https://raw.githubusercontent.com/zapplyjobs/Internships-2027/main/README.md
  - kind: markdown
    name: speedy-swe-2027-us
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md
  - kind: markdown
    name: speedy-swe-2027-intl
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/INTERN_INTL.md

# Prior-year feeds are source intelligence only: employer, ATS, and career-domain census.
# Their old roles never enter the 2027 feed; a watch becomes current only after finding a live role.
universe_seeds:
  - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README.md
  - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README-Inactive.md
  - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README-Off-Season.md
  - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/archived/README-2025.md

# Employer ecosystems add organizations, not job listings. Each profile is resolved through
# the organization's official site, and any hiring surface remains a candidate until GAIA
# successfully enumerates it. This deliberately reaches companies omitted by prestige lists.
employer_ecosystems:
  # Recent federal R&D awardees expose obscure technical small businesses that rarely
  # appear in prestige-oriented internship repositories. The official SBIR API is
  # evidence only; company websites and hiring surfaces still require validation.
  - kind: sbir-awards
    name: recent-federal-rd-awardees
    url: https://api.www.sbir.gov/public/api/awards
    years: [2024, 2025, 2026]
    rows: 5000
    max_pages: 2
    internship_signal: 0.18
    technical_signal: 0.98
  - kind: yc-directory
    name: yc-hard-tech
    url: https://www.ycombinator.com/companies/industry/hard-tech
    sectors: [hard-tech, hardware, robotics, aerospace, energy]
    internship_signal: 0.30
    technical_signal: 0.94
  - kind: yc-directory
    name: yc-artificial-intelligence
    url: https://www.ycombinator.com/companies/industry/artificial-intelligence
    sectors: [artificial-intelligence, machine-learning, data]
    internship_signal: 0.30
    technical_signal: 0.92
  - kind: yc-directory
    name: yc-enterprise-software
    url: https://www.ycombinator.com/companies/industry/enterprise-software
    sectors: [enterprise-software, developer-tools, infrastructure]
    internship_signal: 0.26
    technical_signal: 0.84

# Provider-level sources are allowed here; employers are discovered from data, not named in code.
native_sources:
  - kind: google-careers

workday:
  # Keep the query basis narrow. The Workday shared edge is globally paced and retries 429s;
  # broad terms such as student, university, campus, and summer are intentionally rejected.
  search_terms:
    - intern
    - co-op

market_discovery:
  github:
    enabled: true
    repos_per_query: 20
    max_repositories: 100
    pushed_within_days: 365
    queries:
      - '"2027 internships" in:name,description,readme'
      - '"Summer 2027" internships in:name,description,readme'
      - '"2027 SWE" internships in:name,description,readme'
      - '"2027 software" internship in:name,description,readme'
      - '"2027 data" internship in:name,description,readme'
      - '"2027 machine learning" internship in:name,description,readme'
      - '"2027 hardware" internship in:name,description,readme'
      - '"2027 cybersecurity" internship in:name,description,readme'
      - '"2027 product" internship in:name,description,readme'
      - '"2027 quant" internships in:name,description,readme'
