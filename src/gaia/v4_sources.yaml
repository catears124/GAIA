# GAIA v4: low-latency market sensors.
#
# These feeds are discovery sensors, not verification authorities. A role may enter
# the product as a Lead immediately and is upgraded only after GAIA independently
# reaches the employer/ATS URL.
#
# `cycle: active` means the upstream feed spans currently-open internship cycles.
# GAIA classifies each row from its own title/evidence and does NOT stamp it Summer
# 2027. `cycle: summer-2027` is reserved for genuinely season-scoped registries.

sensors:
  - name: surya-multisource-2027
    kind: json-list
    cycle: active
    url: https://raw.githubusercontent.com/SuryaHarikrishnan/internship-tracker/master/data/listings.json
    priority: 110

  - name: simplify-offseason-2027
    kind: markdown
    cycle: active
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README-Off-Season.md
    priority: 110

  - name: simplify-2027
    kind: markdown
    cycle: summer-2027
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README.md
    priority: 105

  - name: vansh-2027
    kind: json-list
    cycle: summer-2027
    url: https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json
    priority: 105

  # Independent direct-employer crawler covering Summer 2027 and Fall 2026.
  - name: zshah-engine-2027
    kind: json-map
    cycle: active
    url: https://raw.githubusercontent.com/zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships/main/data/jobs.json
    priority: 100

  # SpeedyApply maintains separate SWE and AI/ML/Data boards. Treat both as market
  # sensors; they are complementary, not substitutes, and each contains internships
  # that never appear in the other board.
  - name: speedy-swe-2027-us
    kind: markdown
    cycle: active
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md
    priority: 100

  - name: speedy-swe-2027-intl
    kind: markdown
    cycle: active
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/INTERN_INTL.md
    priority: 95

  - name: speedy-ai-2027-us
    kind: markdown
    cycle: active
    url: https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/README.md
    priority: 100

  - name: speedy-ai-2027-intl
    kind: markdown
    cycle: active
    url: https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/INTERN_INTL.md
    priority: 95

  - name: faang-direct-crawler
    kind: markdown
    cycle: active
    url: https://raw.githubusercontent.com/Emjumaev/FAANG-2027-Internships-Tracker/main/README.md
    priority: 90

  # Despite the repository name, this is a real-time all-cycle internship board.
  # Its README currently mixes Summer 2027, Spring 2027, Fall 2026, and cycle-less
  # internships. Treating it as Summer 2027 was a concrete v3 classification bug.
  - name: zapply-2027
    kind: markdown
    cycle: active
    url: https://raw.githubusercontent.com/zapplyjobs/Internships-2027/main/README.md
    priority: 100

  # This repository explicitly includes Summer 2027 plus fall/winter/spring terms,
  # so it is an active-cycle sensor rather than a Summer-only authority.
  - name: sndsh404-2027
    kind: markdown
    cycle: active
    url: https://raw.githubusercontent.com/sndsh404/summer-2027-internships/main/README.md
    priority: 85

  - name: northwestern-quant-2027
    kind: markdown
    cycle: summer-2027
    url: https://raw.githubusercontent.com/northwesternfintech/2027QuantInternships/main/README.md
    priority: 85
