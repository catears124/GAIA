# GAIA v4: low-latency market sensors.
#
# These feeds are discovery sensors, not verification authorities. A role may enter
# the product as a Lead immediately and is upgraded only after GAIA independently
# reaches the employer/ATS URL. The point is to stop pretending a slow employer
# universe crawl is a substitute for market awareness.

sensors:
  # Multi-source aggregator refreshed several times per day. The JSON carries
  # explicit term arrays plus source timestamps, so it is substantially more useful
  # than scraping a rendered list and guessing when a row appeared.
  - name: surya-multisource-2027
    kind: json-list
    cycle: mixed
    url: https://raw.githubusercontent.com/SuryaHarikrishnan/internship-tracker/master/data/listings.json
    priority: 110

  - name: simplify-2027
    kind: markdown
    cycle: summer-2027
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README.md
    priority: 100

  - name: vansh-2027
    kind: json-list
    cycle: summer-2027
    url: https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json
    priority: 100

  # Independent crawler with a machine-readable employer-job state file.
  - name: zshah-engine-2027
    kind: json-map
    cycle: mixed
    url: https://raw.githubusercontent.com/zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships/main/data/jobs.json
    priority: 100

  - name: speedy-swe-2027-us
    kind: markdown
    cycle: summer-2027
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md
    priority: 95

  - name: speedy-swe-2027-intl
    kind: markdown
    cycle: summer-2027
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/INTERN_INTL.md
    priority: 90

  # Direct-company crawler focused on large tech employers. Mixed-cycle is
  # intentional: GAIA only accepts rows whose title explicitly establishes 2027.
  - name: faang-direct-crawler
    kind: markdown
    cycle: mixed
    url: https://raw.githubusercontent.com/Emjumaev/FAANG-2027-Internships-Tracker/main/README.md
    priority: 90

  - name: dreamwork-direct-crawler
    kind: markdown
    cycle: mixed
    url: https://raw.githubusercontent.com/dreamworkhq/Tech-Internships-2027/main/README.md
    priority: 90

  - name: zapply-2027
    kind: markdown
    cycle: summer-2027
    url: https://raw.githubusercontent.com/zapplyjobs/Internships-2027/main/README.md
    priority: 85

  - name: sndsh404-2027
    kind: markdown
    cycle: summer-2027
    url: https://raw.githubusercontent.com/sndsh404/summer-2027-internships/main/README.md
    priority: 85

  - name: northwestern-quant-2027
    kind: markdown
    cycle: summer-2027
    url: https://raw.githubusercontent.com/northwesternfintech/2027QuantInternships/main/README.md
    priority: 85
