services:
  - type: worker
    name: gaia-inventory
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: gaia worker
    autoDeploy: true
    envVars:
      - key: GAIA_DATABASE_URL
        sync: false
      - key: GAIA_GITHUB_TOKEN
        sync: false
      - key: GAIA_WORKER_CONCURRENCY
        value: "12"
      - key: GAIA_WORKDAY_FULL_INVENTORY
        value: "1"
      - key: GAIA_WORKDAY_MAX_PER_TERM
        value: "20000"
      - key: GAIA_MARKET_DISCOVERY_INTERVAL
        value: "900"
      - key: GAIA_UNIVERSE_DISCOVERY_INTERVAL
        value: "86400"
