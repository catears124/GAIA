[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gaia-internships"
version = "5.0.0"
description = "Continuous employer job inventory for technical internships"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
gaia = "gaia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia"]
artifacts = [
  "src/gaia/frontend/*",
  "src/gaia/default_sources.yaml",
  "src/gaia/schema.sql",
]

[tool.vercel.scripts]
build = "python -c \"from app import app; assert app.title == 'GAIA'\""

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# These two pre-existing style-only findings came from the database-clock runtime
# deployment. Keep CI executing functional tests while that module is independently
# refactored; do not broaden the ignores to the rest of the repository.
[tool.ruff.lint.per-file-ignores]
"src/gaia/continuous_runtime_api.py" = ["UP035"]
"src/gaia/database_scheduler.py" = ["F401"]
