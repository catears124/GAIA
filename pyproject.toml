[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gaia-internships"
version = "1.0.0"
description = "Great, Another Internship Aggregator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dateutil>=2.9",
  "PyYAML>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
gaia = "gaia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia"]
artifacts = [
  "src/gaia/frontend/*",
  "src/gaia/default_sources.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
